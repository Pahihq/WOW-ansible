---
# Отправка отчёта в Telegram. Вход: telegram_message (строка, HTML).
- name: Чтение credentials Telegram
  ansible.builtin.slurp:
    src: "{{ telegram_env_file }}"
  register: tg_env
  delegate_to: localhost
  become: false
  no_log: true

- name: Разбор credentials
  ansible.builtin.set_fact:
    tg_token: "{{ (tg_env.content | b64decode | regex_search('TELEGRAM_BOT_TOKEN=\"?([^\"\\n]+)', '\\1') | first) }}"
    tg_chat: "{{ (tg_env.content | b64decode | regex_search('TELEGRAM_CHAT_ID=\"?([^\"\\n]+)', '\\1') | first) }}"
  no_log: true

- name: Отправка сообщения
  ansible.builtin.uri:
    url: "{{ telegram_api }}/bot{{ tg_token }}/sendMessage"
    method: POST
    body_format: json
    body:
      chat_id: "{{ tg_chat }}"
      message_thread_id: "{{ tg_thread | default('', true) | int if (tg_thread | default('', true)) | length > 0 else omit }}"
      text: "{{ telegram_message }}"
      parse_mode: "{{ telegram_parse_mode }}"
      disable_web_page_preview: true
    status_code: [200]
    return_content: true
  register: tg_res
  delegate_to: localhost
  become: false
  changed_when: true
  failed_when: false
  no_log: true

- name: Результат отправки
  ansible.builtin.debug:
    msg: >-
      Telegram: {{ 'отчёт отправлен' if (tg_res.status | default(0)) == 200
      else 'НЕ отправлен (код ' ~ (tg_res.status | default('?')) ~ ') — ротацию это не отменяет' }}
