---
kuma_venv_python: "{{ playbook_dir }}/../.venv/bin/python"
kuma_cli: "{{ playbook_dir }}/scripts/kuma_cli.py"
kuma_env_file: "{{ playbook_dir }}/secrets/kuma.env"
# Группа «💫CDN + БС» в Kuma.
kuma_parent_group: 18
kuma_interval: 60
kuma_retries: 2
# Монитор именуется по ноде и провайдеру: при ротации он переезжает на новый
# фронт своего провайдера, сохраняя историю проверок и алерты.
kuma_monitor_name: "CDN_{{ inventory_hostname }}_{{ cdn_provider | default('VK') | upper }}"
