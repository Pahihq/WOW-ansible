---
# ============================================================
# Детект динамических портов: SSH и NODE_PORT
# ============================================================

# --- SSH-порт: определяем реально слушающий порт sshd ---
# Не хардкодим 22: при default deny + неверный порт = потеря доступа.
# Берём 4-ю колонку (Local Address:Port) строк ss, где есть sshd.
- name: "SSH | Извлечь порт(ы) sshd через ss"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      ss -tlnHp 2>/dev/null
      | awk '/sshd/ {print $4}'
      | sed -E 's/.*:([0-9]+)$/\1/'
      | sort -u
  args:
    executable: /bin/bash
  register: ufw_ssh_ports
  changed_when: false
  failed_when: false
  check_mode: false

- name: "SSH | Зафиксировать список найденных портов"
  ansible.builtin.set_fact:
    ufw_ssh_detected_ports: >-
      {{ ufw_ssh_ports.stdout_lines
         | map('trim')
         | select('match', '^[0-9]+$')
         | list }}

- name: "SSH | Fallback на ansible_port/22, если детект пуст"
  ansible.builtin.set_fact:
    ufw_ssh_detected_ports: ["{{ ufw_ssh_port_fallback }}"]
  when: ufw_ssh_detected_ports | length == 0

- name: "SSH | Проверить диапазон портов"
  ansible.builtin.assert:
    that:
      - item | string is match('^[0-9]+$')
      - item | int >= 1
      - item | int <= 65535
    fail_msg: "Некорректный SSH-порт: {{ item }}"
  loop: "{{ ufw_ssh_detected_ports }}"

- name: "SSH | Показать порты, которые будут открыты"
  ansible.builtin.debug:
    msg: "SSH-порты для allow: {{ ufw_ssh_detected_ports }}"

# --- NODE_PORT: парсим из docker-compose ноды ---
- name: "NODE_PORT | Найти существующий docker-compose"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ ufw_remnanode_compose_candidates }}"
  register: ufw_compose_stats

- name: "NODE_PORT | Зафиксировать все найденные compose-файлы"
  ansible.builtin.set_fact:
    ufw_compose_paths: >-
      {{ (ufw_compose_stats.results
          | selectattr('stat.exists', 'equalto', true)
          | map(attribute='stat.path')
          | list) }}

- name: "NODE_PORT | Извлечь значения из docker-compose"
  ansible.builtin.command:
    argv:
      - grep
      - --only-matching
      - --perl-regexp
      - "^\\h*(?:-\\h*)?[\"']?NODE_PORT[\"']?\\h*(?:=|:)\\h*[\"']?\\K[0-9]{1,5}(?![0-9])"
      - "{{ item }}"
  loop: "{{ ufw_compose_paths }}"
  register: ufw_node_port_scan
  changed_when: false
  failed_when: ufw_node_port_scan.rc not in [0, 1]
  check_mode: false

- name: "NODE_PORT | Инициализировать список найденных портов"
  ansible.builtin.set_fact:
    ufw_node_port_matches: []

- name: "NODE_PORT | Собрать найденные порты"
  ansible.builtin.set_fact:
    ufw_node_port_matches: "{{ ufw_node_port_matches + item.stdout_lines }}"
  loop: "{{ ufw_node_port_scan.results }}"
  when: item.rc == 0

- name: "NODE_PORT | Зафиксировать единственный найденный порт"
  ansible.builtin.set_fact:
    ufw_node_port_candidates: "{{ ufw_node_port_matches | default([]) | unique | list }}"
    ufw_node_port: >-
      {{ ((ufw_node_port_matches | default([]) | unique | list | first)
          if (ufw_node_port_matches | default([]) | unique | list | length == 1)
          else '') }}

- name: "NODE_PORT | Fail, если найдены разные порты"
  ansible.builtin.fail:
    msg: >-
      В compose-файлах {{ ufw_compose_paths }} найдены разные NODE_PORT:
      {{ ufw_node_port_candidates }}. Оставь одно актуальное значение.
  when: ufw_node_port_candidates | length > 1

- name: "NODE_PORT | Проверить диапазон порта"
  ansible.builtin.assert:
    that:
      - ufw_node_port | int >= 1
      - ufw_node_port | int <= 65535
    fail_msg: >-
      Некорректный NODE_PORT={{ ufw_node_port }} в {{ ufw_compose_paths }}.
      Ожидается порт от 1 до 65535.
  when: (ufw_node_port | string | length) > 0

- name: "NODE_PORT | Fail, если порт не найден"
  ansible.builtin.fail:
    msg: >-
      Не удалось извлечь NODE_PORT из {{ ufw_compose_paths }}.
      Проверь строку вида 'NODE_PORT=23412' или 'NODE_PORT: 23412'.
  when:
    - ufw_require_node_port | bool
    - (ufw_node_port | default('') | string | length) == 0

- name: "NODE_PORT | Предупреждение, если compose не найден"
  ansible.builtin.debug:
    msg: >-
      docker-compose не найден ни по одному из путей
      {{ ufw_remnanode_compose_candidates }} — правило для панели пропущено.
  when:
    - not (ufw_require_node_port | bool)
    - ufw_compose_paths | length == 0
