---
# Зоны, доступные account-токену Cloudflare из playbook/secrets/.env.
# Проверено 2026-08-01: velqario.site, zorelium.site, watchnode.shop.
cdn_domain_zones:
  - velqario.site
  - zorelium.site
  - watchnode.shop

# Слова для генерации имён. Origin и фронт берут РАЗНЫЕ слова и могут быть в разных зонах —
# связать их по имени со стороны не выйдет.
cdn_domain_origin_words: [beas, lemas, kora, vespa, tando, mirel, kasta, norva, seldo, arvi, plesk, tomea]
cdn_domain_front_words:  [stream, edge, media, live, cdn, node, relay, delta, flux, wave, pulse, cast]
cdn_domain_front_suffix: [leam, beas, vira, nord, kite, alto, remo, luna, sten, orbi]

cloudflare_api_base: "https://api.cloudflare.com/client/v4"
cdn_domain_env_file: "{{ playbook_dir }}/secrets/.env"
