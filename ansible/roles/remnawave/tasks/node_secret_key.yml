---
# Получает SECRET_KEY панели для RemnaNode только при первой установке.
# Каждый GET /api/keygen выпускает новый node-сертификат, поэтому повторные
# запуски обязаны использовать уже сохранённый ключ.

- name: Проверка сохранённого SECRET_KEY на ноде
  ansible.builtin.stat:
    path: "{{ remnanode_secret_key_path }}"
  register: rw_node_secret_key_file

- name: Чтение сохранённого SECRET_KEY
  ansible.builtin.slurp:
    src: "{{ remnanode_secret_key_path }}"
  register: rw_node_secret_key_saved
  when: rw_node_secret_key_file.stat.exists
  no_log: true

- name: Проверка существующего Compose для миграции ключа
  ansible.builtin.stat:
    path: "{{ remnanode_dir }}/docker-compose.yml"
  register: rw_node_compose_file
  when: not rw_node_secret_key_file.stat.exists

- name: Чтение существующего Compose для миграции ключа
  ansible.builtin.slurp:
    src: "{{ remnanode_dir }}/docker-compose.yml"
  register: rw_node_compose_saved
  when:
    - not rw_node_secret_key_file.stat.exists
    - rw_node_compose_file.stat.exists | default(false)
  no_log: true

- name: Выбор ранее сохранённого SECRET_KEY
  ansible.builtin.set_fact:
    rw_node_existing_secret_key: >-
      {{ ((rw_node_secret_key_saved.content | b64decode) | trim)
         if rw_node_secret_key_file.stat.exists
         else (((rw_node_compose_saved.content | default('') | b64decode)
                | regex_findall('(?m)^\\s*-\\s*SECRET_KEY=(.+)$')
                | first)
               | default('', true)
               | trim) }}
  no_log: true

- name: Получение нового SECRET_KEY из панели при первой установке
  ansible.builtin.uri:
    url: "{{ remnawave_base_url }}/api/keygen"
    headers: "{{ remnawave_headers }}"
    return_content: true
    status_code: [200]
  register: rw_node_secret_key_response
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when: rw_node_existing_secret_key | length == 0

- name: Выбор SECRET_KEY для RemnaNode
  ansible.builtin.set_fact:
    remnanode_secret_key: >-
      {{ rw_node_existing_secret_key
         if rw_node_existing_secret_key | length > 0
         else rw_node_secret_key_response.json.response.secretKey }}
  no_log: true

- name: Проверка итогового SECRET_KEY
  ansible.builtin.assert:
    that:
      - remnanode_secret_key | length > 0
    fail_msg: >-
      Не удалось прочитать сохранённый SECRET_KEY или получить
      response.secretKey через GET /api/keygen.
  no_log: true

- name: Сохранение SECRET_KEY на ноде для повторных запусков
  ansible.builtin.copy:
    content: "{{ remnanode_secret_key }}\n"
    dest: "{{ remnanode_secret_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
