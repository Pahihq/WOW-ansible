---
- name: Подготовить рабочий каталог RemnaNode на Debian/Ubuntu
  hosts: docker_nodes
  become: true
  gather_facts: true

  vars:
    remnanode_dir: /opt/remnanode
    supported_distributions:
      - Debian
      - Ubuntu

  tasks:
    - name: Проверить поддержку дистрибутива
      ansible.builtin.assert:
        that:
          - ansible_distribution in supported_distributions
          - ansible_distribution_release is defined
          - ansible_distribution_release | length > 0
        fail_msg: >-
          Этот playbook поддерживает только Debian и Ubuntu.
          Текущая система: {{ ansible_distribution }}
          {{ ansible_distribution_version }}
          {{ ansible_distribution_release | default('неизвестно') }}

    - name: Создать каталог RemnaNode
      ansible.builtin.file:
        path: "{{ remnanode_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

- name: Установить стандартный Docker-стек Remnawave Node
  hosts: docker_nodes
  become: true
  gather_facts: false

  vars:
    remnanode_dir: /opt/remnanode
    remnanode_log_dir: /var/log/remnanode
    remnanode_api_port: 21412
    remnanode_secret_key_path: "{{ remnanode_dir }}/.secret_key"

  roles:
    - role: remnawave

  pre_tasks:
    - name: Проверить Docker CLI
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Проверить плагин Docker Compose
      ansible.builtin.command: docker compose version
      changed_when: false

  tasks:
    - name: Получить SECRET_KEY RemnaNode через API панели
      ansible.builtin.include_role:
        name: remnawave
        tasks_from: node_secret_key

    - name: Создать каталог логов RemnaNode
      ansible.builtin.file:
        path: "{{ remnanode_log_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Создать Compose-файл стандартного Remnawave Node
      ansible.builtin.template:
        src: templates/remnanode-docker-compose.yml.j2
        dest: "{{ remnanode_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify:
        - Запустить стандартный стек Remnawave

    - name: Показать параметры подключения стандартного RemnaNode
      ansible.builtin.debug:
        msg:
          - "Порт API: {{ remnanode_api_port }}"

  handlers:
    - name: Запустить стандартный стек Remnawave
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ remnanode_dir }}"
      changed_when: true
