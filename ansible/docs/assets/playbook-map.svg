<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Карта playbook WOW Ansible</title>
  <desc id="desc">Инфраструктура, наблюдаемость, CDN и диагностика Telegram.</desc>
  <defs>
