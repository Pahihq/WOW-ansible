    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#27b7ff"/><stop offset="1" stop-color="#5468ff"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#a77cff"/><stop offset="1" stop-color="#e36dce"/></linearGradient>
  </defs>
  <rect width="1200" height="270" rx="24" fill="url(#background)"/>
