---
- name: Обновить Linux-хосты без перезагрузки
  hosts: all
  become: true
  gather_facts: true
  serial: "20%"

  vars:
    apt_upgrade_mode: safe
    supported_distributions:
      - Debian
      - Ubuntu
    repo_codename_fallbacks: &repo_codename_fallbacks
      Debian:
        - trixie
        - bookworm
        - bullseye
      Ubuntu:
        - noble
        - jammy
        - focal
        - bionic

  pre_tasks:
    - name: Отклонить неподдерживаемый дистрибутив
      ansible.builtin.fail:
        msg: "Неподдерживаемый дистрибутив: {{ ansible_distribution }}"
      when: ansible_distribution not in supported_distributions

  tasks:
    - name: Дебиан/Убунту | Обновите кэш apt и обновите пакеты без перезагрузки.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: "{{ apt_upgrade_mode }}"
        dpkg_options: "force-confdef,force-confold"
      environment:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_SUSPEND: "1"

    - name: Дебиан/Убунту | Проверьте, требуется ли перезагрузка
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: debian_reboot_required
      changed_when: false

    - name: Сообщить о необходимости перезагрузки, но не перезагружаться
      ansible.builtin.debug:
        msg: >-
          Хост {{ inventory_hostname }} обновлён.
          Требуется перезагрузка:
          {{
            debian_reboot_required.stat.exists | default(false)
          }}

- name: Установите общие пакеты хоста
  hosts: all
  become: true
  gather_facts: true

  vars:
    common_debian_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - expect
      - git
      - gnupg
      - iperf3
      - locales
      - lsb-release
      - nano
      - tar
      - unzip
      - zsh
      - ncdu
      - duf
      - btop
      - iotop
      - jq
      - nftables
      - python3-apt
      - python3-requests
      - sysbench
      - wget

  tasks:
    - name: Дебиан/Убунту | Установите общие пакеты
      ansible.builtin.apt:
        name: "{{ common_debian_packages }}"
        state: present
        update_cache: true

    - name: Дебиан/Убунту | Включить локаль en_US.UTF-8
      ansible.builtin.lineinfile:
        path: /etc/locale.gen
        regexp: '^#?\s*en_US\.UTF-8\s+UTF-8'
        line: en_US.UTF-8 UTF-8
        owner: root
        group: root
        mode: "0644"
      register: en_us_locale_config

    - name: Дебиан/Убунту | Создать локаль en_US.UTF-8
      ansible.builtin.command: locale-gen en_US.UTF-8
      changed_when: true
      when: en_us_locale_config.changed

    - name: Дебиан/Убунту | Проверить текущую локаль по умолчанию
      ansible.builtin.command: awk -F= '$1 == "LANG" { gsub(/"/, "", $2); print $2 }' /etc/default/locale
      register: default_locale_check
      changed_when: false
      failed_when: false

    - name: Дебиан/Убунту | Установите локаль по умолчанию en_US.UTF-8.
      ansible.builtin.command: update-locale LANG=en_US.UTF-8
      changed_when: true
      when: default_locale_check.stdout != 'en_US.UTF-8'

- name: Установите Docker Engine для хостов RemnaNode.
  hosts: all
  become: true
  gather_facts: true

  vars:
    docker_keyring_path: /etc/apt/keyrings/docker.asc
    docker_sources_path: /etc/apt/sources.list.d/docker.sources

    docker_repo_os_map:
      Debian: debian
      Ubuntu: ubuntu

    repo_codename_fallbacks: *repo_codename_fallbacks

  tasks:
    - name: Определите переменные репозитория Docker
      ansible.builtin.set_fact:
        docker_repo_os: "{{ docker_repo_os_map[ansible_distribution] }}"
        repo_codename_candidates: "{{ ([ansible_distribution_release] + repo_codename_fallbacks[ansible_distribution]) | unique | list }}"

    - name: Убедитесь, что каталог apt keyrings существует.
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Проверьте, установлен ли официальный пакет Docker
      ansible.builtin.command: dpkg-query -W -f='${Status}' docker-ce
      register: docker_ce_package_check
      changed_when: false
      failed_when: false

    - name: Удалите конфликтующие пакеты Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent
      when: docker_ce_package_check.rc != 0

    - name: Получить архитектуру dpkg
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false
      when: docker_ce_package_check.rc != 0

    - name: Проверьте доступные репозитории Docker.
      ansible.builtin.uri:
        url: "https://download.docker.com/linux/{{ docker_repo_os }}/dists/{{ item }}/Release"
        method: GET
        status_code:
          - 200
          - 404
        return_content: false
        timeout: 15
      loop: "{{ repo_codename_candidates }}"
      register: docker_repo_checks
      changed_when: false
      failed_when: false
      when: docker_ce_package_check.rc != 0

    - name: Выберите первое доступное кодовое имя репозитория Docker.
      ansible.builtin.set_fact:
        docker_supported_codename: >-
          {{
            (
              docker_repo_checks.results
              | selectattr('status', 'equalto', 200)
              | map(attribute='item')
              | list
              | first
            )
            | default('', true)
          }}
      when: docker_ce_package_check.rc != 0

    - name: Ошибка, если не найдено поддерживаемое кодовое имя репозитория Docker.
      ansible.builtin.fail:
        msg: >-
          Поддерживаемый репозиторий Docker не найден.
          ОС: {{ ansible_distribution }}.
          ОС репозитория: {{ docker_repo_os }}.
          Проверенные кодовые имена: {{ repo_codename_candidates | join(', ') }}.
      when:
        - docker_ce_package_check.rc != 0
        - docker_supported_codename | length == 0

    - name: Загрузите официальный ключ GPG Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_repo_os }}/gpg"
        dest: "{{ docker_keyring_path }}"
        owner: root
        group: root
        mode: "0644"
        force: true
      when: docker_ce_package_check.rc != 0

    - name: Добавить официальный репозиторий Docker
      ansible.builtin.copy:
        dest: "{{ docker_sources_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/{{ docker_repo_os }}
          Suites: {{ docker_supported_codename }}
          Components: stable
          Architectures: {{ dpkg_arch.stdout }}
          Signed-By: {{ docker_keyring_path }}
      when: docker_ce_package_check.rc != 0

    - name: Обновить кеш apt после добавления репозитория Docker
      ansible.builtin.apt:
        update_cache: true
      when: docker_ce_package_check.rc != 0

    - name: Установите плагин Docker Engine и Compose.
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: docker_ce_package_check.rc != 0

    - name: Включите и запустите Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

- name: Установите RemnaNode Speedtest и хост-сервисы.
  hosts: all
  become: true
  gather_facts: true

  vars:
    ookla_armored_key_path: /tmp/ookla_speedtest-cli.gpgkey
    ookla_keyring_path: /etc/apt/keyrings/ookla_speedtest-cli-archive-keyring.gpg
    ookla_sources_path: /etc/apt/sources.list.d/ookla_speedtest-cli.sources

    ookla_repo_os_map:
      Debian: debian
      Ubuntu: ubuntu

    repo_codename_fallbacks: *repo_codename_fallbacks

  tasks:
    - name: Определите переменные репозитория Ookla
      ansible.builtin.set_fact:
        ookla_repo_os: "{{ ookla_repo_os_map[ansible_distribution] }}"
        repo_codename_candidates: "{{ ([ansible_distribution_release] + repo_codename_fallbacks[ansible_distribution]) | unique | list }}"

    - name: Включить и запустить nftables
      ansible.builtin.systemd:
        name: nftables
        enabled: true
        state: started

    - name: Проверьте установленный пакет на наличие /usr/bin/speedtest.
      ansible.builtin.command: dpkg-query -S /usr/bin/speedtest
      register: speedtest_owner_check
      changed_when: false
      failed_when: false

    - name: Удалите конфликтующий пакет дистрибутива Speedtest-cli.
      ansible.builtin.apt:
        name: speedtest-cli
        state: absent
        purge: true
      when: >
        speedtest_owner_check.rc == 0 and
        'speedtest-cli' in speedtest_owner_check.stdout

    - name: Исправить прерванное состояние dpkg
      ansible.builtin.command: dpkg --configure -a
      changed_when: false
      failed_when: false

    - name: Исправить сломанные зависимости apt
      ansible.builtin.apt:
        state: fixed
      failed_when: false

    - name: Проверьте, установлен ли официальный пакет Ookla Speedtest.
      ansible.builtin.command: dpkg-query -W -f='${Status}' speedtest
      register: official_speedtest_package_check
      changed_when: false
      failed_when: false

    - name: Найдите старые/конфликтующие файлы репозитория Ookla.
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns:
          - "ookla_speedtest-cli*.list"
          - "ookla_speedtest-cli*.sources"
        file_type: file
      register: old_ookla_repo_files
      when: official_speedtest_package_check.rc != 0

    - name: Удалите старые/конфликтующие файлы репозитория Ookla.
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_ookla_repo_files.files | default([]) }}"
      when: official_speedtest_package_check.rc != 0

    - name: Удалите старые/конфликтующие брелоки Ookla.
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/keyrings/ookla_speedtest-cli.asc
        - /etc/apt/keyrings/ookla_speedtest-cli-archive-keyring.gpg
        - /usr/share/keyrings/ookla_speedtest-cli-archive-keyring.gpg
      when: official_speedtest_package_check.rc != 0

    - name: Очистите кеш apt после удаления конфликтующего репозитория Ookla.
      ansible.builtin.command: apt-get clean
      register: apt_clean_result
      retries: 20
      delay: 15
      until: apt_clean_result.rc == 0
      changed_when: false

    - name: Проверьте доступные репозитории Ookla
      ansible.builtin.uri:
        url: "https://packagecloud.io/ookla/speedtest-cli/{{ ookla_repo_os }}/dists/{{ item }}/Release"
        method: GET
        status_code:
          - 200
          - 404
        return_content: false
        timeout: 15
      loop: "{{ repo_codename_candidates }}"
      register: ookla_repo_checks
      changed_when: false
      failed_when: false
      when: official_speedtest_package_check.rc != 0

    - name: Выберите первое доступное кодовое имя репозитория Ookla.
      ansible.builtin.set_fact:
        ookla_supported_codename: >-
          {{
            (
              ookla_repo_checks.results
              | selectattr('status', 'equalto', 200)
              | map(attribute='item')
              | list
              | first
            )
            | default('', true)
          }}
      when: official_speedtest_package_check.rc != 0

    - name: Ошибка, если не найдено поддерживаемое кодовое имя репозитория Ookla.
      ansible.builtin.fail:
        msg: >-
          Поддерживаемый репозиторий Ookla Speedtest не найден.
          ОС: {{ ansible_distribution }}.
          ОС репозитория: {{ ookla_repo_os }}.
          Проверенные кодовые имена: {{ repo_codename_candidates | join(', ') }}.
      when:
        - official_speedtest_package_check.rc != 0
        - ookla_supported_codename | length == 0

    - name: Загрузите GPG-ключ Ookla packagecloud в виде бронированного файла.
      ansible.builtin.get_url:
        url: https://packagecloud.io/ookla/speedtest-cli/gpgkey
        dest: "{{ ookla_armored_key_path }}"
        owner: root
        group: root
        mode: "0644"
        force: true
      when: official_speedtest_package_check.rc != 0

    - name: Преобразование ключа Ookla GPG в бинарный брелок
      ansible.builtin.command:
        cmd: "gpg --dearmor -o {{ ookla_keyring_path }} {{ ookla_armored_key_path }}"
      changed_when: true
      when: official_speedtest_package_check.rc != 0

    - name: Установите разрешения для ключей Ookla
      ansible.builtin.file:
        path: "{{ ookla_keyring_path }}"
        owner: root
        group: root
        mode: "0644"
      when: official_speedtest_package_check.rc != 0

    - name: Добавить репозиторий Ookla Speedtest
      ansible.builtin.copy:
        dest: "{{ ookla_sources_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://packagecloud.io/ookla/speedtest-cli/{{ ookla_repo_os }}
          Suites: {{ ookla_supported_codename }}
          Components: main
          Signed-By: {{ ookla_keyring_path }}
      when: official_speedtest_package_check.rc != 0

    - name: Обновить кэш apt после добавления репозитория Ookla
      ansible.builtin.apt:
        update_cache: true
      when: official_speedtest_package_check.rc != 0

    - name: Установите официальный Ookla Speedtest
      ansible.builtin.apt:
        name: speedtest
        state: present
      when: official_speedtest_package_check.rc != 0

    - name: Примите лицензию Ookla и GDPR
      ansible.builtin.command: speedtest --accept-license --accept-gdpr
      changed_when: false
      failed_when: false

- name: Настройка подкачки RemnaNode и настройка sysctl
  hosts: all
  become: true
  gather_facts: true

  vars:
    sysctl_conf_path: /etc/sysctl.d/99-vps-setup.conf

    swap_file_path: /swapfile
    swap_percent_of_root_fs: 10
    swap_min_size_mb: 512

    sysctl_params:
      net.core.default_qdisc: cake
      net.ipv4.tcp_congestion_control: bbr
      net.core.somaxconn: "65535"
      net.ipv4.tcp_max_syn_backlog: "8192"
      net.ipv4.tcp_tw_reuse: "1"
      net.ipv4.tcp_fin_timeout: "15"
      vm.swappiness: "40"
      fs.file-max: "1000000"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv6.conf.lo.disable_ipv6: "1"
  tasks:
    - name: Проверить текущий активный своп
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: active_swaps
      changed_when: false
      failed_when: false

    - name: Проверьте, существует ли уже файл подкачки
      ansible.builtin.stat:
        path: "{{ swap_file_path }}"
      register: swap_file_stat

    - name: Получить размер корневой файловой системы в МБ
      ansible.builtin.command: df -m --output=size /
      register: root_fs_size_mb_raw
      changed_when: false
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists

    - name: Рассчитать размер свопа
      ansible.builtin.set_fact:
        swap_size_mb: >-
          {{
            [
              (((root_fs_size_mb_raw.stdout_lines[1] | int) * swap_percent_of_root_fs / 100) | round(0, 'floor') | int),
              swap_min_size_mb
            ] | max
          }}
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists

    - name: Показать расчетный размер свопа
      ansible.builtin.debug:
        msg: "Swap не найден. Будет создан {{ swap_file_path }} размером {{ swap_size_mb }} MB"
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists

    - name: Создать файл подкачки с помощью Fallocate
      ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M {{ swap_file_path }}"
      register: swap_fallocate_result
      changed_when: swap_fallocate_result.rc == 0
      failed_when: false
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists

    - name: Создайте файл подкачки с помощью dd, если не удалось выполнить Fallocate.
      ansible.builtin.command: "dd if=/dev/zero of={{ swap_file_path }} bs=1M count={{ swap_size_mb }} status=none"
      changed_when: true
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists
        - swap_fallocate_result.rc is defined
        - swap_fallocate_result.rc != 0

    - name: Установите права доступа к файлу подкачки
      ansible.builtin.file:
        path: "{{ swap_file_path }}"
        owner: root
        group: root
        mode: "0600"
      when: active_swaps.stdout | trim == ""

    - name: Форматировать файл подкачки
      ansible.builtin.command: "mkswap {{ swap_file_path }}"
      changed_when: true
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists

    - name: Включить файл подкачки
      ansible.builtin.command: "swapon {{ swap_file_path }}"
      changed_when: true
      failed_when: false
      when: active_swaps.stdout | trim == ""

    - name: Убедитесь, что файл подкачки присутствует в fstab
      ansible.posix.mount:
        name: none
        src: "{{ swap_file_path }}"
        fstype: swap
        opts: sw
        dump: "0"
        passno: "0"
        state: present

    - name: Показать существующий статус обмена
      ansible.builtin.debug:
        msg: "Swap уже есть, ничего не делаю: {{ active_swaps.stdout_lines }}"
      when: active_swaps.stdout | trim != ""

    - name: Показать окончательный статус обмена
      ansible.builtin.command: swapon --show
      register: swap_status
      changed_when: false
      failed_when: false

    - name: Распечатать окончательный статус обмена
      ansible.builtin.debug:
        var: swap_status.stdout_lines

    - name: Написать конфигурацию оптимизации sysctl
      ansible.builtin.copy:
        dest: "{{ sysctl_conf_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible
          # VPS network optimization: BBR + TCP/sysctl tuning

          {% for key, value in sysctl_params.items() %}
          {{ key }} = {{ value }}
          {% endfor %}

    - name: Немедленно применить параметры sysctl
      ansible.builtin.command: "sysctl -w {{ item.key }}={{ item.value }}"
      loop: "{{ sysctl_params | dict2items }}"
      changed_when: false
      failed_when: false

    - name: Применить конфигурацию системы sysctl
      ansible.builtin.command: sysctl --system
      changed_when: false
      failed_when: false

    - name: Проверьте текущий контроль перегрузки TCP
      ansible.builtin.command: sysctl net.ipv4.tcp_congestion_control
      register: bbr_check
      changed_when: false
      failed_when: false

    - name: Показать статус BBR
      ansible.builtin.debug:
        msg: >-
          {% if 'bbr' in bbr_check.stdout %}
          BBR активен + sysctl оптимизирован
          {% else %}
          BBR НЕ активен. Текущее значение: {{ bbr_check.stdout | default('неизвестно') }}
          {% endif %}

- name: Установите и настройте zsh с помощью oh-my-zsh и powerlevel10k.
  hosts: all
  gather_facts: true
  become: true

  vars:
    # Можно переопределить при запуске:
    # ansible-playbook bootstrap.yml -e zsh_user=root
    zsh_target_user: "{{ zsh_user | default(ansible_user) }}"

    zshrc_source_file: "files/.zshrc"
    p10k_source_file: "files/.p10k.zsh"

    p10k_themes:
      - name: Arctic Blue
        ok_background: 33
        error_background: 160
      - name: Emerald Night
        ok_background: 29
        error_background: 160
      - name: Purple Void
        ok_background: 99
        error_background: 161
      - name: Rose Neon
        ok_background: 168
        error_background: 197
      - name: Sunset Orange
        ok_background: 208
        error_background: 196
      - name: Crimson Steel
        ok_background: 124
        error_background: 196
      - name: Graphite Cyan
        ok_background: 24
        error_background: 160
      - name: Nord Frost
        ok_background: 67
        error_background: 203
      - name: Tokyo Storm
        ok_background: 111
        error_background: 204
      - name: Deep Ocean
        ok_background: 31
        error_background: 160
      - name: Forest Moss
        ok_background: 64
        error_background: 167
      - name: Golden Hour
        ok_background: 178
        error_background: 160
      - name: Lavender Mist
        ok_background: 140
        error_background: 197
      - name: Cyber Lime
        ok_background: 76
        error_background: 196
      - name: Ruby Wine
        ok_background: 89
        error_background: 196

    zsh_git_components:
      - name: powerlevel10k theme
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ zsh_target_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
      - name: zsh-syntax-highlighting plugin
        repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
        dest: "{{ zsh_target_home }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
      - name: zsh-autosuggestions plugin
        repo: https://github.com/zsh-users/zsh-autosuggestions.git
        dest: "{{ zsh_target_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"

  pre_tasks:
    - name: Чтение данных целевой учетной записи пользователя
      ansible.builtin.getent:
        database: passwd
        key: "{{ zsh_target_user }}"

    - name: Сохранять целевые пути пользователей
      ansible.builtin.set_fact:
        zsh_target_gid: "{{ getent_passwd[zsh_target_user][2] }}"
        zsh_target_home: "{{ getent_passwd[zsh_target_user][4] }}"

    - name: Выберите стабильную тему p10k по имени хоста
      ansible.builtin.set_fact:
        p10k_theme: "{{ p10k_themes[(inventory_hostname | hash('md5') | int(base=16)) % (p10k_themes | length)] }}"

  tasks:
    - name: Найти двоичный файл zsh
      ansible.builtin.shell: command -v zsh
      register: zsh_binary
      changed_when: false

    - name: Добавьте zsh в /etc/shells
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: "{{ zsh_binary.stdout }}"
        state: present
        create: true
        mode: "0644"

    - name: Проверьте существующий каталог oh-my-zsh
      ansible.builtin.stat:
        path: "{{ zsh_target_home }}/.oh-my-zsh"
      register: ohmyzsh_dir

    - name: Проверьте существующий git-репозиторий oh-my-zsh.
      ansible.builtin.stat:
        path: "{{ zsh_target_home }}/.oh-my-zsh/.git"
      register: ohmyzsh_git

    - name: Установите oh-my-zsh, если он отсутствует.
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ zsh_target_home }}/.oh-my-zsh"
        version: master
        depth: 1
        update: false
        force: false
      when: not ohmyzsh_dir.stat.exists

    - name: Пропустить существующий каталог oh-my-zsh, отличный от git.
      ansible.builtin.debug:
        msg: "oh-my-zsh уже существует и не является Git-репозиторием; каталог не будет перезаписан: {{ zsh_target_home }}/.oh-my-zsh"
      when:
        - ohmyzsh_dir.stat.exists
        - not ohmyzsh_git.stat.exists

    - name: Убедитесь, что существуют пользовательские каталоги oh-my-zsh.
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ zsh_target_user }}"
        group: "{{ zsh_target_gid }}"
        mode: "0755"
      loop:
        - "{{ zsh_target_home }}/.oh-my-zsh/custom/themes"
        - "{{ zsh_target_home }}/.oh-my-zsh/custom/plugins"

    - name: Проверьте существующие компоненты zsh git
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      loop: "{{ zsh_git_components }}"
      register: zsh_git_component_stats

    - name: Установите недостающие компоненты zsh git
      ansible.builtin.git:
        repo: "{{ item.item.repo }}"
        dest: "{{ item.item.dest }}"
        version: master
        depth: 1
        update: false
        force: false
      loop: "{{ zsh_git_component_stats.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not item.stat.exists

    - name: Проверьте существующий .zshrc
      ansible.builtin.stat:
        path: "{{ zsh_target_home }}/.zshrc"
      register: zshrc_file

    - name: Скопируйте .zshrc, если он отсутствует.
      ansible.builtin.copy:
        src: "{{ zshrc_source_file }}"
        dest: "{{ zsh_target_home }}/.zshrc"
        owner: "{{ zsh_target_user }}"
        group: "{{ zsh_target_gid }}"
        mode: "0644"
      when: not zshrc_file.stat.exists

    - name: Установить тему powerlevel10k в .zshrc
      ansible.builtin.lineinfile:
        path: "{{ zsh_target_home }}/.zshrc"
        regexp: '^ZSH_THEME='
        line: 'ZSH_THEME="powerlevel10k/powerlevel10k"'
        owner: "{{ zsh_target_user }}"
        group: "{{ zsh_target_gid }}"
        mode: "0644"

    - name: Проверьте существующий .p10k.zsh
      ansible.builtin.stat:
        path: "{{ zsh_target_home }}/.p10k.zsh"
      register: p10k_file

    - name: Скопируйте .p10k.zsh, если он отсутствует.
      ansible.builtin.copy:
        src: "{{ p10k_source_file }}"
        dest: "{{ zsh_target_home }}/.p10k.zsh"
        owner: "{{ zsh_target_user }}"
        group: "{{ zsh_target_gid }}"
        mode: "0644"
      when: not p10k_file.stat.exists

    - name: Применить выбранные цвета темы хоста p10k
      ansible.builtin.blockinfile:
        path: "{{ zsh_target_home }}/.p10k.zsh"
        marker: "# {mark} ANSIBLE MANAGED P10K HOST THEME"
        insertafter: EOF
        owner: "{{ zsh_target_user }}"
        group: "{{ zsh_target_gid }}"
        mode: "0644"
        block: |
          # Theme: {{ p10k_theme.name }}
          # Host: {{ inventory_hostname }}

          typeset -g POWERLEVEL9K_OS_ICON_BACKGROUND={{ p10k_theme.ok_background }}
          typeset -g POWERLEVEL9K_DIR_BACKGROUND={{ p10k_theme.ok_background }}

          typeset -g POWERLEVEL9K_VCS_CLEAN_BACKGROUND={{ p10k_theme.ok_background }}
          typeset -g POWERLEVEL9K_VCS_MODIFIED_BACKGROUND={{ p10k_theme.error_background }}
          typeset -g POWERLEVEL9K_VCS_UNTRACKED_BACKGROUND={{ p10k_theme.error_background }}

          typeset -g POWERLEVEL9K_STATUS_OK_BACKGROUND={{ p10k_theme.ok_background }}
          typeset -g POWERLEVEL9K_STATUS_ERROR_BACKGROUND={{ p10k_theme.error_background }}

          typeset -g POWERLEVEL9K_COMMAND_EXECUTION_TIME_BACKGROUND={{ p10k_theme.ok_background }}

          typeset -g POWERLEVEL9K_CONTEXT_BACKGROUND={{ p10k_theme.ok_background }}
          typeset -g POWERLEVEL9K_CONTEXT_ROOT_BACKGROUND={{ p10k_theme.ok_background }}
          typeset -g POWERLEVEL9K_CONTEXT_ROOT_FOREGROUND=15

          typeset -g POWERLEVEL9K_PROMPT_CHAR_OK_VIINS_BACKGROUND={{ p10k_theme.ok_background }}
          typeset -g POWERLEVEL9K_PROMPT_CHAR_OK_VICMD_BACKGROUND={{ p10k_theme.ok_background }}
          typeset -g POWERLEVEL9K_PROMPT_CHAR_ERROR_VIINS_BACKGROUND={{ p10k_theme.error_background }}
          typeset -g POWERLEVEL9K_PROMPT_CHAR_ERROR_VICMD_BACKGROUND={{ p10k_theme.error_background }}

    - name: Источник .p10k.zsh из .zshrc
      ansible.builtin.lineinfile:
        path: "{{ zsh_target_home }}/.zshrc"
        line: '[[ ! -f "$HOME/.p10k.zsh" ]] || source "$HOME/.p10k.zsh"'
        state: present
        insertafter: EOF
        owner: "{{ zsh_target_user }}"
        group: "{{ zsh_target_gid }}"
        mode: "0644"

    - name: Установить zsh в качестве оболочки по умолчанию
      ansible.builtin.user:
        name: "{{ zsh_target_user }}"
        shell: "{{ zsh_binary.stdout }}"

    - name: Исправление владения oh-my-zsh
      ansible.builtin.file:
        path: "{{ zsh_target_home }}/.oh-my-zsh"
        owner: "{{ zsh_target_user }}"
        group: "{{ zsh_target_gid }}"
        recurse: true

    - name: Исправить владение файлами конфигурации
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ zsh_target_user }}"
        group: "{{ zsh_target_gid }}"
        mode: "0644"
      loop:
        - "{{ zsh_target_home }}/.zshrc"
        - "{{ zsh_target_home }}/.p10k.zsh"

    - name: Показать выбранную тему
      ansible.builtin.debug:
        msg: "Выбранная тема p10k для {{ inventory_hostname }}: {{ p10k_theme.name }}"

- name: Настройте WOWVPN neon SSH MOTD и аутентификацию SSH.
  hosts: all
  become: true
  gather_facts: true

  vars:
    sshd_config_path: /etc/ssh/sshd_config
    ssh_motd_script: /etc/update-motd.d/99-WOWVPN
    root_authorized_keys_file: "{{ playbook_dir }}/secrets/root_authorized_keys.pub"

  pre_tasks:
    - name: Проверьте файл авторизованного ключа root на контроллере
      ansible.builtin.stat:
        path: "{{ root_authorized_keys_file }}"
      delegate_to: localhost
      become: false
      register: root_authorized_keys_file_stat

    - name: Чтение корневого авторизованного ключа из файла контроллера
      ansible.builtin.set_fact:
        root_authorized_key: "{{ lookup('ansible.builtin.file', root_authorized_keys_file) | trim }}"
      delegate_to: localhost
      become: false
      when: root_authorized_keys_file_stat.stat.exists

    - name: Подтвердить корневой авторизованный ключ
      ansible.builtin.assert:
        that:
          - root_authorized_keys_file_stat.stat.exists
          - root_authorized_key is defined
          - root_authorized_key | length > 0
        fail_msg: "Поместите открытый SSH-ключ root в {{ root_authorized_keys_file }}"

  tasks:
    - name: Проверьте каталог update-motd
      ansible.builtin.stat:
        path: /etc/update-motd.d
      register: update_motd_dir

    - name: Найдите исполняемые сценарии Debian MOTD по умолчанию.
      ansible.builtin.find:
        paths: /etc/update-motd.d
        file_type: file
        excludes:
          - "{{ ssh_motd_script | basename }}"
      register: default_motd_scripts
      when: update_motd_dir.stat.isdir | default(false)

    - name: При необходимости отключите исполняемые сценарии Debian MOTD по умолчанию.
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "0644"
      loop: "{{ default_motd_scripts.files | default([]) }}"
      when:
        - item.mode is defined
        - (item.mode[-3:] | regex_search('[1357]')) is not none

    - name: Создать неоновый MOTD WOWVPN
      ansible.builtin.template:
        src: templates/wowvpn-motd.sh.j2
        dest: "{{ ssh_motd_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: Найдите дополнительные файлы конфигурации sshd
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        patterns: "*.conf"
        file_type: file
      register: sshd_extra_configs
      failed_when: false

    - name: Прочтите дополнительные файлы конфигурации sshd.
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ sshd_extra_configs.files | default([]) }}"
      register: sshd_extra_config_contents
      when: sshd_extra_configs.matched | default(0) | int > 0

    - name: Удалите только действительно конфликтующие фрагменты конфигурации sshd.
      ansible.builtin.file:
        path: "{{ item.source }}"
        state: absent
      loop: "{{ sshd_extra_config_contents.results | default([]) }}"
      when: >
        item.content is defined and
        (
          (item.content | b64decode) is search('(?im)^\\s*PasswordAuthentication\\s+no\\s*$')
          or (item.content | b64decode) is search('(?im)^\\s*PubkeyAuthentication\\s+no\\s*$')
          or (item.content | b64decode) is search('(?im)^\\s*PermitRootLogin\\s+(no|prohibit-password|without-password)\\s*$')
          or (item.content | b64decode) is search('(?im)^\\s*AuthenticationMethods\\s+.*$')
        )
      notify: Перезапустить службу SSH

    - name: Удалите старые директивы аутентификации SSH из основной конфигурации.
      ansible.builtin.lineinfile:
        path: "{{ sshd_config_path }}"
        regexp: "{{ item }}"
        state: absent
        backup: true
      loop:
        - '^\s*PermitRootLogin\s+.*$'
        - '^\s*PasswordAuthentication\s+.*$'
        - '^\s*PubkeyAuthentication\s+.*$'
        - '^\s*KbdInteractiveAuthentication\s+.*$'
        - '^\s*ChallengeResponseAuthentication\s+.*$'
        - '^\s*AuthenticationMethods\s+.*$'
        - '^\s*PermitEmptyPasswords\s+.*$'
        - '^\s*X11Forwarding\s+.*$'
        - '^\s*MaxAuthTries\s+.*$'
        - '^\s*ClientAliveInterval\s+.*$'
        - '^\s*ClientAliveCountMax\s+.*$'
        - '^\s*LoginGraceTime\s+.*$'
        - '^\s*DebianBanner\s+.*$'
        - '^\s*PrintMotd\s+.*$'
        - '^\s*PrintLastLog\s+.*$'
      notify: Перезапустить службу SSH

    - name: Настройка политики аутентификации SSH
      ansible.builtin.blockinfile:
        path: "{{ sshd_config_path }}"
        marker: "# {mark} ANSIBLE MANAGED SSH AUTH POLICY"
        backup: true
        block: |
          # Disable default Debian SSH banner
          DebianBanner no

          # Enable dynamic MOTD
          PrintMotd yes

          # Enable last login message
          PrintLastLog yes

          # Allow root login by password and SSH key
          PermitRootLogin yes

          # Allow password authentication for all users
          PasswordAuthentication yes

          # Enable SSH public key authentication
          PubkeyAuthentication yes

          # Disable keyboard-interactive authentication
          KbdInteractiveAuthentication no

          # Disable challenge-response authentication
          ChallengeResponseAuthentication no

          # Disallow empty passwords
          PermitEmptyPasswords no

          # Disable X11 forwarding
          X11Forwarding no

          # Limit failed authentication attempts
          MaxAuthTries 3

          # Send keepalive every 15 minutes
          ClientAliveInterval 900

          # Disconnect after 2 missed keepalives
          ClientAliveCountMax 2

          # Time allowed for login
          LoginGraceTime 30
      notify: Перезапустить службу SSH

    - name: Проверьте конфигурацию sshd
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Отключить вывод pam_motd по умолчанию
      ansible.builtin.replace:
        path: /etc/pam.d/sshd
        regexp: '^(session\s+optional\s+pam_motd\.so.*)$'
        replace: '# \1'
        backup: true
      notify: Перезапустить службу SSH

    - name: Показывать WOWVPN MOTD непосредственно при входе в систему по SSH
      ansible.builtin.lineinfile:
        path: /etc/pam.d/sshd
        regexp: '^session\s+optional\s+pam_exec\.so\s+stdout\s+/usr/bin/run-parts\s+/etc/update-motd\.d$'
        line: 'session    optional     pam_exec.so stdout /usr/bin/run-parts /etc/update-motd.d'
        insertbefore: '^#?\s*session\s+optional\s+pam_motd\.so'
        state: present
        backup: true
      notify: Перезапустить службу SSH

    - name: Убедитесь, что корневой каталог .ssh существует.
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Добавьте открытый ключ SSH в корневой авторизованный ключ.
      ansible.builtin.authorized_key:
        user: root
        state: present
        key: "{{ root_authorized_key }}"

  handlers:
    - name: Перезапустить службу SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
