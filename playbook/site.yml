---
- name: Подготовить состояние оркестрации
  hosts: all
  gather_facts: false
  tasks:
    - name: Инициализировать список завершённых playbook
      ansible.builtin.set_fact:
        orchestration_playbooks_done: []

    - name: Использовать имя хоста inventory как имя экземпляра мониторинга по умолчанию
      ansible.builtin.set_fact:
        monitoring_instance_name: "{{ monitoring_instance_name | default(inventory_hostname, true) }}"

- name: Выполнить базовую настройку хостов
  ansible.builtin.import_playbook: bootstrap.yml

- name: Отметить базовую настройку завершённой
  hosts: all
  gather_facts: false
  tasks:
    - name: Добавить базовую настройку в список завершённых playbook
      ansible.builtin.set_fact:
        orchestration_playbooks_done: "{{ orchestration_playbooks_done + ['system_update', 'zsh', 'ssh'] }}"

- name: Настроить RemnaNode
  ansible.builtin.import_playbook: remnanode.yml

- name: Отметить настройку RemnaNode завершённой
  hosts: docker_nodes
  gather_facts: false
  tasks:
    - name: Добавить настройку RemnaNode в список завершённых playbook
      ansible.builtin.set_fact:
        orchestration_playbooks_done: "{{ orchestration_playbooks_done + ['remnanode', 'remnanode_nginx'] }}"

- name: Настроить межсетевой экран
  ansible.builtin.import_playbook: ufw.yml

- name: Настроить стек мониторинга
  ansible.builtin.import_playbook: monitoring.yml

- name: Отметить настройку мониторинга завершённой
  hosts: all
  gather_facts: false
  tasks:
    - name: Добавить настройку мониторинга в список завершённых playbook
      ansible.builtin.set_fact:
        orchestration_playbooks_done: "{{ orchestration_playbooks_done + ['monitoring'] }}"

- name: Обновить отчётность
  ansible.builtin.import_playbook: reporting.yml
