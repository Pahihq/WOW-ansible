---
- name: Prepare orchestration state
  hosts: all
  gather_facts: false
  tasks:
    - name: Initialize completed playbook list
      ansible.builtin.set_fact:
        orchestration_playbooks_done: []

    - name: Use inventory hostname as default monitoring instance name
      ansible.builtin.set_fact:
        monitoring_instance_name: "{{ inventory_hostname }}"
      when: monitoring_instance_name is not defined

- name: Run zsh playbook
  ansible.builtin.import_playbook: zsh.yml

- name: Mark zsh playbook completed
  hosts: all
  gather_facts: false
  tasks:
    - name: Add zsh.yml to completed playbooks
      ansible.builtin.set_fact:
        orchestration_playbooks_done: "{{ orchestration_playbooks_done + ['zsh.yml'] }}"

- name: Run ssh playbook
  ansible.builtin.import_playbook: ssh.yml

- name: Mark ssh playbook completed
  hosts: all
  gather_facts: false
  tasks:
    - name: Add ssh.yml to completed playbooks
      ansible.builtin.set_fact:
        orchestration_playbooks_done: "{{ orchestration_playbooks_done + ['ssh.yml'] }}"

- name: Run RemnaNode playbook
  ansible.builtin.import_playbook: install_remnanode.yml

- name: Mark RemnaNode playbook completed
  hosts: docker_nodes
  gather_facts: false
  tasks:
    - name: Add install_remnanode.yml to completed playbooks
      ansible.builtin.set_fact:
        orchestration_playbooks_done: "{{ orchestration_playbooks_done + ['install_remnanode.yml'] }}"

- name: Run monitoring playbook
  ansible.builtin.import_playbook: install_monitoring.yml

- name: Mark monitoring playbook completed
  hosts: all
  gather_facts: false
  tasks:
    - name: Add install_monitoring.yml to completed playbooks
      ansible.builtin.set_fact:
        orchestration_playbooks_done: "{{ orchestration_playbooks_done + ['install_monitoring.yml'] }}"

- name: Collect host inventory and speedtest data
  hosts: all
  gather_facts: true
  vars:
    speedtest_command: |
      if command -v speedtest >/dev/null 2>&1; then
        speedtest --accept-license --accept-gdpr --format=json && exit 0
      fi
      if command -v speedtest-cli >/dev/null 2>&1; then
        speedtest-cli --json && exit 0
        speedtest-cli && exit 0
      fi
      exit 127
  tasks:
    - name: Detect public IP
      ansible.builtin.uri:
        url: https://api.ipify.org
        return_content: true
        timeout: 10
      register: public_ip_lookup
      changed_when: false
      failed_when: false

    - name: Check if speedtest tool is installed
      ansible.builtin.shell: command -v speedtest || command -v speedtest-cli
      register: speedtest_path
      changed_when: false
      failed_when: false

    - name: Run speedtest when available
      ansible.builtin.shell: "{{ speedtest_command }}"
      register: speedtest_result
      changed_when: false
      failed_when: false
      when: speedtest_path.rc == 0

    - name: Parse speedtest JSON safely
      block:
        - name: Save parsed speedtest JSON
          ansible.builtin.set_fact:
            speedtest_json: "{{ speedtest_result.stdout | from_json }}"
          when:
            - speedtest_result.stdout is defined
            - speedtest_result.rc | default(1) == 0
            - speedtest_result.stdout | trim | regex_search('^\\{')
      rescue:
        - name: Mark speedtest JSON parse as failed
          ansible.builtin.set_fact:
            speedtest_json_parse_failed: true

    - name: Parse text speedtest-cli output safely
      ansible.builtin.set_fact:
        speedtest_text_download_mbps: "{{ (speedtest_result.stdout | regex_search('(?im)^Download:\\s*([0-9]+(?:\\.[0-9]+)?)\\s*Mbit/s', '\\1') | default([], true) | first) | default('') }}"
        speedtest_text_upload_mbps: "{{ (speedtest_result.stdout | regex_search('(?im)^Upload:\\s*([0-9]+(?:\\.[0-9]+)?)\\s*Mbit/s', '\\1') | default([], true) | first) | default('') }}"
        speedtest_text_ping_ms: "{{ (speedtest_result.stdout | regex_search('(?im):\\s*([0-9]+(?:\\.[0-9]+)?)\\s*ms\\s*$', '\\1') | default([], true) | first) | default('') }}"
      when:
        - speedtest_json is not defined
        - speedtest_result.stdout is defined
        - speedtest_result.rc | default(1) == 0

    - name: Build Google Sheets row payload
      ansible.builtin.set_fact:
        orchestration_sheet_row:
          host: "{{ inventory_hostname }}"
          public_ip: "{{ public_ip_lookup.content | default('') | trim }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          cpu_vcpus: "{{ ansible_processor_vcpus | default(ansible_processor_count | default('')) }}"
          memory_mb: "{{ ansible_memtotal_mb }}"
          root_disk_total: >-
            {{
              (
                ansible_mounts
                | selectattr('mount', 'equalto', '/')
                | map(attribute='size_total')
                | first
                | default(0)
                | int / 1024 / 1024 / 1024
              )
              | round(2)
            }} GB
          speedtest_status: >-
            {% if speedtest_path.rc != 0 %}not_installed{% elif speedtest_json is defined or speedtest_text_download_mbps | default('') | length > 0 %}ok{% else %}failed{% endif %}
          speedtest_download_mbps: >-
            {% if speedtest_json is defined %}
            {% if speedtest_json.download.bandwidth is defined %}
            {{ (speedtest_json.download.bandwidth | default(0) | float * 8 / 1000000) | round(2) }}
            {% else %}
            {{ (speedtest_json.download | default(0) | float / 1000000) | round(2) }}
            {% endif %}
            {% elif speedtest_text_download_mbps | default('') | length > 0 %}
            {{ speedtest_text_download_mbps | float | round(2) }}
            {% else %}{% endif %}
          speedtest_upload_mbps: >-
            {% if speedtest_json is defined %}
            {% if speedtest_json.upload.bandwidth is defined %}
            {{ (speedtest_json.upload.bandwidth | default(0) | float * 8 / 1000000) | round(2) }}
            {% else %}
            {{ (speedtest_json.upload | default(0) | float / 1000000) | round(2) }}
            {% endif %}
            {% elif speedtest_text_upload_mbps | default('') | length > 0 %}
            {{ speedtest_text_upload_mbps | float | round(2) }}
            {% else %}{% endif %}
          speedtest_ping_ms: >-
            {% if speedtest_json is defined %}
            {% if speedtest_json.ping.latency is defined %}
            {{ speedtest_json.ping.latency | default(0) | float | round(2) }}
            {% else %}
            {{ speedtest_json.ping | default(0) | float | round(2) }}
            {% endif %}
            {% elif speedtest_text_ping_ms | default('') | length > 0 %}
            {{ speedtest_text_ping_ms | float | round(2) }}
            {% else %}{% endif %}
          zsh_done: "{{ 'zsh.yml' in orchestration_playbooks_done }}"
          ssh_done: "{{ 'ssh.yml' in orchestration_playbooks_done }}"
          remnanode_done: "{{ 'install_remnanode.yml' in orchestration_playbooks_done }}"
          monitoring_done: "{{ 'install_monitoring.yml' in orchestration_playbooks_done }}"

- name: Update Google Sheet from controller
  hosts: all
  gather_facts: false
  vars:
    google_sheet_enabled: true
    google_sheet_id_file: "{{ playbook_dir }}/secrets/google_sheet_id"
    google_sheet_id: "{{ lookup('ansible.builtin.env', 'GOOGLE_SHEET_ID') | default('', true) | trim }}"
    google_sheet_tab: "{{ lookup('ansible.builtin.env', 'GOOGLE_SHEET_TAB') | default('ansible_inventory', true) }}"
    google_credentials_file: "{{ lookup('ansible.builtin.env', 'GOOGLE_CREDENTIALS_FILE') | default(playbook_dir + '/secrets/google_credentials.json', true) }}"
    google_sheet_auto_install_python_packages: true
  tasks:
    - name: Check Google Sheet ID file
      ansible.builtin.stat:
        path: "{{ google_sheet_id_file }}"
      register: google_sheet_id_file_stat
      delegate_to: localhost
      run_once: true
      when:
        - google_sheet_enabled | bool
        - google_sheet_id | length == 0

    - name: Read Google Sheet ID from controller file
      ansible.builtin.set_fact:
        google_sheet_id: "{{ lookup('ansible.builtin.file', google_sheet_id_file) | trim }}"
      delegate_to: localhost
      run_once: true
      when:
        - google_sheet_enabled | bool
        - google_sheet_id | length == 0
        - google_sheet_id_file_stat.stat.exists | default(false)

    - name: Ensure GOOGLE_SHEET_ID is set
      ansible.builtin.assert:
        that:
          - google_sheet_id | length > 0
        fail_msg: >-
          GOOGLE_SHEET_ID is empty. Put spreadsheet id into {{ google_sheet_id_file }}
          or run: GOOGLE_SHEET_ID='spreadsheet_id' ansible-playbook -i inventory.yml orchestrate.yml
      delegate_to: localhost
      run_once: true
      when: google_sheet_enabled | bool

    - name: Check Google credentials file
      ansible.builtin.stat:
        path: "{{ google_credentials_file }}"
      register: google_credentials_file_stat
      delegate_to: localhost
      run_once: true
      when: google_sheet_enabled | bool

    - name: Ensure Google credentials file exists
      ansible.builtin.assert:
        that:
          - google_credentials_file_stat.stat.exists
        fail_msg: "Put Google service account JSON into {{ google_credentials_file }} or set GOOGLE_CREDENTIALS_FILE."
      delegate_to: localhost
      run_once: true
      when: google_sheet_enabled | bool

    - name: Check Google Sheets Python packages
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import google.oauth2.service_account, googleapiclient.discovery"
      register: google_python_packages_check
      changed_when: false
      failed_when: false
      delegate_to: localhost
      run_once: true
      when: google_sheet_enabled | bool

    - name: Install Google Sheets Python packages on controller
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - pip
          - install
          - --user
          - -r
          - "{{ playbook_dir }}/requirements-google-sheets.txt"
      changed_when: true
      delegate_to: localhost
      run_once: true
      when:
        - google_sheet_enabled | bool
        - google_sheet_auto_install_python_packages | bool
        - google_python_packages_check.rc != 0

    - name: Update Google Sheet
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/scripts/update_google_sheet.py"
          - "--credentials"
          - "{{ google_credentials_file }}"
          - "--spreadsheet-id"
          - "{{ google_sheet_id }}"
          - "--worksheet"
          - "{{ google_sheet_tab }}"
          - "--rows-file"
          - "-"
        stdin: |
          {{
            ansible_play_hosts_all
            | map('extract', hostvars, 'orchestration_sheet_row')
            | select('defined')
            | list
            | to_nice_json
          }}
      changed_when: true
      delegate_to: localhost
      run_once: true
      when: google_sheet_enabled | bool
