---
# Пул сигнатур xHTTP. ЕДИНЫЙ ИСТОЧНИК ИСТИНЫ для трёх мест сразу:
#   1) инбаунд в конфиг-профиле панели (xhttpSettings.path + .extra)
#   2) location в nginx на ноде
#   3) хост в панели (path + xhttpExtraParams)
# Расходиться они не могут по построению — всё рендерится отсюда.
#
# Один слот = один инбаунд CDN_Pxx. Нода активирует ровно один слот,
# поэтому порт 127.0.0.1:10085 у всех общий (так же сосуществуют CDNVK и CDNYandex_v2).
# При ротации берётся СВОБОДНЫЙ слот -> меняются и path, и все имена cookie разом.
#
# Уникальны по построению: path, seqKey, sessionKey, xPaddingKey, xPaddingHeader.
# sessionKey+sessionIDKey — пара с ОДНИМ значением (§7.5): старое ядро читает первое,
# новое — второе, имя cookie одинаковое в обе стороны.
#
# Слот P07 (streaming) = действующая боевая сигнатура инбаунда CDNVK, менять нельзя.

xhttp_signatures:
- slot: P01
  legend: bookstore
  inbound_tag: CDN_P01
  path: /api/library/sync
  mode: auto
  uplink_http_method: HEAD
  extra:
    path: /api/library/sync
    xmux:
      cMaxLifetimeMs: 0
      cMaxReuseTimes: 36-96
      maxConcurrency: 16-32
      maxConnections: '0'
      hMaxRequestTimes: 320-640
      hMaxReusableSecs: 720-1800
    seqKey: page
    seqPlacement: cookie
    sessionKey: reader_id
    sessionPlacement: cookie
    sessionIDKey: reader_id
    sessionIDPlacement: cookie
    xPaddingKey: _r
    xPaddingHeader: X-Library-Token
    xPaddingMethod: tokenish
    xPaddingBytes: 100-1000
    xPaddingObfsMode: true
    xPaddingPlacement: queryInHeader
    uplinkChunkSize: 0
    uplinkHTTPMethod: HEAD
    uplinkDataPlacement: body
    scMaxEachPostBytes: '1000000'
    scMinPostsIntervalMs: '70'
    headers:
      Accept: application/vnd.api+json
      Accept-Language: ru-RU,ru;q=0.9
      Cache-Control: no-cache
      Pragma: no-cache
