---
# Полная ротация: общий origin/profile -> один или два CDN-фронта -> панель/Kuma.
#
#   вхолостую:  ansible-playbook playbook/rotate_cdn.yml --limit node_ch1 -e cdn_dry_run=true
#   боевой:     ansible-playbook playbook/rotate_cdn.yml --limit node_ch1
#   провайдер:  -e cdn_provider=vk|yandex|both
#
- name: Ротация CDN-фронта
  hosts: eu_nodes
  gather_facts: true
  serial: 1
  vars:
    cdn_dry_run: false
    cdn_resume: false
    cdn_legacy_inbound_tag: CDNVK
    # Признак запуска сторожом 451 (playbook/scripts/cdn_watchdog.py).
    auto_trigger: false
    # Гасить ли прошлое плечо ноды по завершении: при авторотации — да,
    # при ручном запуске старое плечо остаётся включённым, снимаешь сам.
    cdn_retire_previous: "{{ auto_trigger | bool }}"
  roles:
    - role: remnawave
  tasks:
    - name: Проверка режима CDN
      ansible.builtin.assert:
        that: cdn_provider in ['vk', 'yandex', 'both']
        fail_msg: "cdn_provider должен быть vk, yandex или both"

    - name: Выбор CDN-провайдеров
      ansible.builtin.set_fact:
        cdn_providers_selected: "{{ ['vk', 'yandex'] if cdn_provider == 'both' else [cdn_provider] }}"

    - name: Загрузка состояния ротации ноды
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: load

    - name: Распознавание legacy VK для перехода на both
      ansible.builtin.set_fact:
        cdn_legacy_vk_migration: >-
          {{ (cdn_state.legacy_vk_migration | default(false) | bool)
             or (cdn_provider == 'both'
                 and (cdn_state.status | default('')) == 'active'
                 and cdn_state.front_domain is defined
                 and cdn_state.origin_domain is defined
                 and cdn_state.front_domains is not defined
                 and (cdn_state.cdn_provider | default('vk')) == 'vk') }}

    - name: План миграции legacy VK
      ansible.builtin.debug:
        msg: >-
          Legacy VK будет принят без пересоздания:
          origin {{ cdn_state.origin_domain }}, VK {{ cdn_state.front_domain }}.
          Новым будет только фронт Yandex.
      when: cdn_legacy_vk_migration | bool

    - name: Режим продолжения незавершённой ротации
      ansible.builtin.set_fact:
        cdn_resuming: >-
          {{ (cdn_resume | bool)
             and ((cdn_state.status | default('')) == 'in_progress')
             and (cdn_state.front_domain is defined) }}

    - name: Что делаем
      ansible.builtin.debug:
        msg: >-
          {{
            'ПРОДОЛЖАЕМ незавершённую ротацию: ' ~ cdn_state.front_domain
            if cdn_resuming | bool
            else (
              'Новая ротация'
              ~ (
                ' (незавершённая ротация '
                ~ (cdn_state.front_domain | default('?'))
                ~ ' будет брошена — вычисти её playbook/rotate_cleanup.yml)'
                if (cdn_state.status | default('')) == 'in_progress'
                else ''
              )
            )
          }}

    - name: Загрузка пула сигнатур
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/xhttp_signatures.yml"

    - name: Получение нод и инбаундов панели
      ansible.builtin.uri:
        url: "{{ remnawave_base_url }}{{ item }}"
        headers: "{{ remnawave_headers }}"
        return_content: true
      register: rot_lookup
      loop: ['/api/nodes/', '/api/config-profiles/inbounds']
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Сопоставление ноды инвентаря с нодой панели по IP
      ansible.builtin.set_fact:
        rw_all_inbounds: "{{ rot_lookup.results[1].json.response.inbounds }}"
        cdn_node_uuid: >-
          {{ (rot_lookup.results[0].json.response
              | selectattr('address', 'equalto', ansible_host) | list | first).uuid }}
        cdn_node_ip: "{{ ansible_host }}"

    - name: Наличие слотов CDN_Pxx в панели
      ansible.builtin.set_fact:
        cdn_slots_exist: >-
          {{ (rw_all_inbounds | map(attribute='tag') | select('match', '^CDN_P[0-9]{2}$') | list | length) > 0 }}

    - name: Проверка маршрута legacy VK
      ansible.builtin.assert:
        that:
          - cdn_state.inbound_tag | default('') | length > 0
          - cdn_state.path | default('') | length > 0
        fail_msg: >-
          Legacy state не содержит inbound_tag/path; автоматическая
          миграция остановлена, чтобы не переключить рабочий VK навслепую.
      when: cdn_legacy_vk_migration | bool

    - name: Повторное использование inbound и path legacy VK
      ansible.builtin.set_fact:
        cdn_inbound_tag: "{{ cdn_state.inbound_tag }}"
        cdn_path: "{{ cdn_state.path }}"
      when: cdn_legacy_vk_migration | bool

    - name: Выбор свободного слота сигнатуры
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/remnawave/tasks/slot_allocate.yml"
      when:
        - cdn_slots_exist | bool
        - not (cdn_legacy_vk_migration | bool)

    # Пока инбаунды CDN_Pxx не заведены, ротация идёт на легаси-инбаунде:
    # домены меняются, путь остаётся прежним. Уникальные пути включатся после
    # playbook/profile_inbounds_sync.yml -e apply=true.
    - name: Откат на легаси-инбаунд, если слоты ещё не заведены
      ansible.builtin.set_fact:
        cdn_inbound_tag: "{{ cdn_legacy_inbound_tag }}"
        cdn_path: >-
          {{ (rw_all_inbounds | selectattr('tag', 'equalto', cdn_legacy_inbound_tag)
              | list | first).rawInbound.streamSettings.xhttpSettings.path }}
      when:
        - not (cdn_slots_exist | bool)
        - not (cdn_legacy_vk_migration | bool)

    - name: Предупреждение про неуникальный путь
      ansible.builtin.debug:
        msg: >-
          ВНИМАНИЕ: слоты CDN_Pxx в панели отсутствуют, ротация идёт на {{ cdn_legacy_inbound_tag }}.
          Домены меняются, путь остаётся {{ cdn_path }}.
      when:
        - not (cdn_slots_exist | bool)
        - not (cdn_legacy_vk_migration | bool)

    - name: Генерация доменов и A-записи origin
      ansible.builtin.include_role:
        name: cdn_domain
      vars:
        cdn_reuse_existing_origin: "{{ cdn_legacy_vk_migration }}"
        cdn_origin_domain_existing: >-
          {{ cdn_state.origin_domain if cdn_legacy_vk_migration else '' }}
        cdn_front_domains_existing: >-
          {{ {'vk': cdn_state.front_domain} if cdn_legacy_vk_migration else {} }}
      when: not (cdn_resuming | bool)

    - name: Восстановление доменов из состояния
      ansible.builtin.set_fact:
        cdn_origin_domain_new: "{{ cdn_state.origin_domain }}"
        cdn_front_domains_new: >-
          {{ cdn_state.front_domains
             | default({(cdn_state.cdn_provider | default(cdn_provider)): cdn_state.front_domain}) }}
      when: cdn_resuming | bool

    # Прошлая ротация фиксируется ДО перезаписи состояния: без этого UUID старого
    # хоста теряется, и погасить старое плечо автоматически уже нечем.
    - name: Запоминание прошлой ротации
      ansible.builtin.set_fact:
        cdn_prev: >-
          {{ {'host_uuid': cdn_state.host_uuid | default(''),
              'host_uuids': cdn_state.host_uuids | default({}),
              'front_domain': cdn_state.front_domain | default(''),
              'front_domains': cdn_state.front_domains | default({}),
              'origin_domain': cdn_state.origin_domain | default(''),
              'vk_resource_id': cdn_state.vk_resource_id | default(''),
              'cdn_resource_ids': cdn_state.cdn_resource_ids | default({}),
              'inbound_tag': cdn_state.inbound_tag | default('')}
             if ((cdn_state.status | default('')) == 'active'
                 and not (cdn_resuming | bool)
                 and not (cdn_legacy_vk_migration | bool))
             else {} }}

    - name: Фиксация начатой ротации
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: save
      vars:
        cdn_state_patch:
          node: "{{ inventory_hostname }}"
          status: in_progress
          prev: "{{ cdn_prev }}"
          started_at: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}"
          cdn_provider: "{{ cdn_provider }}"
          legacy_vk_migration: "{{ cdn_legacy_vk_migration }}"
          origin_domain: "{{ cdn_origin_domain_new }}"
          front_domain: "{{ cdn_front_domains_new[cdn_providers_selected | first] }}"
          front_domains: "{{ cdn_front_domains_new }}"
          node_ip: "{{ cdn_node_ip }}"
          inbound_tag: "{{ cdn_inbound_tag }}"
          path: "{{ cdn_path }}"
      when: not (cdn_dry_run | bool)

    - name: Включение инбаунда на ноде
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/remnawave/tasks/node_activate_inbound.yml"
      when: not (cdn_dry_run | bool)

    - name: Раскатка origin-декоя, nginx и сертификата
      ansible.builtin.include_role:
        name: xhttp_origin
      vars:
        primary_domain: "{{ cdn_origin_domain_new }}"
        cdn_domain: "{{ cdn_front_domains_new[cdn_providers_selected | first] }}"
        cdn_tunnel_path: "{{ cdn_path }}"
      when: not (cdn_dry_run | bool)

    - name: Создание и подключение фронтов CDN
      ansible.builtin.include_tasks: tasks/rotate_cdn_provider.yml
      loop: "{{ cdn_providers_selected }}"
      loop_control:
        loop_var: cdn_provider_current
      when: not (cdn_dry_run | bool)

    - name: Фиксация ресурсов CDN в состоянии
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: save
      vars:
        cdn_state_patch:
          cdn_resource_id: "{{ cdn_resource_ids[cdn_providers_selected | first] }}"
          cdn_resource_ids: "{{ cdn_resource_ids }}"
          certificate_ids: "{{ cdn_certificate_ids }}"
      when: not (cdn_dry_run | bool)

    # Старое плечо гасим только после того, как новое ВСТАЛО в балансер:
    # порядок обратный оставил бы плитку на одном плече в момент правки шаблона.
    - name: Гашение старого плеча
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/remnawave/tasks/host_retire.yml"
      vars:
        remnawave_retire_uuid: "{{ cdn_old_host_uuid }}"
      loop: >-
        {{ (cdn_prev.host_uuids | default({})).values() | list
           if (cdn_prev.host_uuids | default({}) | length > 0)
           else [cdn_prev.host_uuid | default('')] }}
      loop_control:
        loop_var: cdn_old_host_uuid
      when:
        - not (cdn_dry_run | bool)
        - cdn_old_host_uuid | length > 0
        - cdn_retire_previous | default(false) | bool

    - name: Пометка ротации как завершённой
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: save
      vars:
        cdn_state_patch:
          status: active
          host_uuid: "{{ cdn_host_uuids[cdn_providers_selected | first] }}"
          host_uuids: "{{ cdn_host_uuids }}"
          legacy_vk_migration: false
          finished_at: "{{ lookup('pipe', 'date -Iseconds') }}"
      when: not (cdn_dry_run | bool)

    - name: Отчёт в Telegram
      ansible.builtin.include_role:
        name: telegram
      vars:
        telegram_message: |-
          <b>Ротация CDN выполнена</b>
          нода: <code>{{ inventory_hostname }}</code> ({{ cdn_node_ip }})
          origin: <code>{{ cdn_origin_domain_new }}</code>
          фронты: <code>{{ cdn_front_domains_new | to_json }}</code>
          инбаунд: <code>{{ cdn_inbound_tag }}</code>  path: <code>{{ cdn_path }}</code>
          ресурсы: <code>{{ cdn_resource_ids | to_json }}</code>
          хосты панели: <code>{{ cdn_host_uuids | to_json }}</code>
          плеч в балансере: {{ (rw_tpl_after.json.response.templateJson.remnawave.injectHosts | first).selector['values'] | default([], true) | length }}
          мониторы Kuma: {{ cdn_monitor_names | to_json }}
      when: not (cdn_dry_run | bool)

    - name: Итог ротации
      ansible.builtin.debug:
        msg:
          - "нода:    {{ inventory_hostname }} ({{ ansible_host }})"
          - "origin:  {{ cdn_origin_domain_new }}"
          - "фронты:  {{ cdn_front_domains_new }}"
          - "инбаунд: {{ cdn_inbound_tag }} · path {{ cdn_path }}"
          - "сайт:    {{ cdn_site_variant | default('(dry-run)') }}"
          - "хосты:   {{ cdn_host_uuids | default('(dry-run)') }}"
