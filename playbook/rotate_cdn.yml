---
# Полная ротация CDN-фронта ноды: домены -> origin-декой -> ресурс VK -> хост в панели -> балансер.
#
#   вхолостую:  ansible-playbook playbook/rotate_cdn.yml --limit node_ch1 -e cdn_dry_run=true
#   боевой:     ansible-playbook playbook/rotate_cdn.yml --limit node_ch1
#
- name: Ротация CDN-фронта
  hosts: eu_nodes
  gather_facts: true
  serial: 1
  vars:
    cdn_dry_run: false
    cdn_resume: false
    cdn_legacy_inbound_tag: CDNVK
    # Признак запуска сторожом 451 (playbook/scripts/cdn_watchdog.py).
    auto_trigger: false
    # Гасить ли прошлое плечо ноды по завершении: при авторотации — да,
    # при ручном запуске старое плечо остаётся включённым, снимаешь сам.
    cdn_retire_previous: "{{ auto_trigger | bool }}"
  roles:
    - role: remnawave
  tasks:
    - name: Загрузка состояния ротации ноды
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: load

    - name: Режим продолжения незавершённой ротации
      ansible.builtin.set_fact:
        cdn_resuming: >-
          {{ (cdn_resume | bool)
             and ((cdn_state.status | default('')) == 'in_progress')
             and (cdn_state.front_domain is defined) }}

    - name: Что делаем
      ansible.builtin.debug:
        msg: >-
          {{ 'ПРОДОЛЖАЕМ незавершённую ротацию: ' ~ cdn_state.front_domain
             if cdn_resuming | bool
             else 'Новая ротация' ~ (' (незавершённая ротация ' ~ (cdn_state.front_domain | default('?')) ~ ' будет брошена — вычисти её playbook/rotate_cleanup.yml)' if (cdn_state.status | default('')) == 'in_progress' else '') }}

    - name: Загрузка пула сигнатур
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/xhttp_signatures.yml"

    - name: Получение нод и инбаундов панели
      ansible.builtin.uri:
        url: "{{ remnawave_base_url }}{{ item }}"
        headers: "{{ remnawave_headers }}"
        return_content: true
      register: rot_lookup
      loop: ['/api/nodes/', '/api/config-profiles/inbounds']
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Сопоставление ноды инвентаря с нодой панели по IP
      ansible.builtin.set_fact:
        rw_all_inbounds: "{{ rot_lookup.results[1].json.response.inbounds }}"
        cdn_node_uuid: >-
          {{ (rot_lookup.results[0].json.response
              | selectattr('address', 'equalto', ansible_host) | list | first).uuid }}
        cdn_node_ip: "{{ ansible_host }}"

    - name: Наличие слотов CDN_Pxx в панели
      ansible.builtin.set_fact:
        cdn_slots_exist: >-
          {{ (rw_all_inbounds | map(attribute='tag') | select('match', '^CDN_P[0-9]{2}$') | list | length) > 0 }}

    - name: Выбор свободного слота сигнатуры
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/remnawave/tasks/slot_allocate.yml"
      when: cdn_slots_exist | bool

    # Пока инбаунды CDN_Pxx не заведены, ротация идёт на легаси-инбаунде:
    # домены меняются, путь остаётся прежним. Уникальные пути включатся после
    # playbook/profile_inbounds_sync.yml -e apply=true.
    - name: Откат на легаси-инбаунд, если слоты ещё не заведены
      ansible.builtin.set_fact:
        cdn_inbound_tag: "{{ cdn_legacy_inbound_tag }}"
        cdn_path: >-
          {{ (rw_all_inbounds | selectattr('tag', 'equalto', cdn_legacy_inbound_tag)
              | list | first).rawInbound.streamSettings.xhttpSettings.path }}
      when: not (cdn_slots_exist | bool)

    - name: Предупреждение про неуникальный путь
      ansible.builtin.debug:
        msg: >-
          ВНИМАНИЕ: слоты CDN_Pxx в панели отсутствуют, ротация идёт на {{ cdn_legacy_inbound_tag }}.
          Домены меняются, путь остаётся {{ cdn_path }}.
      when: not (cdn_slots_exist | bool)

    - name: Генерация доменов и A-записи origin
      ansible.builtin.include_role:
        name: cdn_domain
      when: not (cdn_resuming | bool)

    - name: Восстановление доменов из состояния
      ansible.builtin.set_fact:
        cdn_origin_domain_new: "{{ cdn_state.origin_domain }}"
        cdn_front_domain_new: "{{ cdn_state.front_domain }}"
      when: cdn_resuming | bool

    # Прошлая ротация фиксируется ДО перезаписи состояния: без этого UUID старого
    # хоста теряется, и погасить старое плечо автоматически уже нечем.
    - name: Запоминание прошлой ротации
      ansible.builtin.set_fact:
        cdn_prev: >-
          {{ {'host_uuid': cdn_state.host_uuid | default(''),
              'front_domain': cdn_state.front_domain | default(''),
              'origin_domain': cdn_state.origin_domain | default(''),
              'vk_resource_id': cdn_state.vk_resource_id | default(''),
              'inbound_tag': cdn_state.inbound_tag | default('')}
             if ((cdn_state.status | default('')) == 'active' and not (cdn_resuming | bool))
             else {} }}

    - name: Фиксация начатой ротации
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: save
      vars:
        cdn_state_patch:
          node: "{{ inventory_hostname }}"
          status: in_progress
          prev: "{{ cdn_prev }}"
          started_at: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}"
          origin_domain: "{{ cdn_origin_domain_new }}"
          front_domain: "{{ cdn_front_domain_new }}"
          node_ip: "{{ cdn_node_ip }}"
          inbound_tag: "{{ cdn_inbound_tag }}"
          path: "{{ cdn_path }}"
      when: not (cdn_dry_run | bool)

    - name: Включение инбаунда на ноде
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/remnawave/tasks/node_activate_inbound.yml"
      when: not (cdn_dry_run | bool)

    - name: Раскатка origin-декоя, nginx и сертификата
      ansible.builtin.include_role:
        name: xhttp_origin
      vars:
        primary_domain: "{{ cdn_origin_domain_new }}"
        cdn_domain: "{{ cdn_front_domain_new }}"
        cdn_tunnel_path: "{{ cdn_path }}"
      when: not (cdn_dry_run | bool)

    - name: Создание CDN-ресурса VK и CNAME фронта
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/scripts/setup-cdn.sh"
          - --cdn
          - "{{ cdn_front_domain_new }}"
          - --origin
          - "{{ cdn_origin_domain_new }}"
        chdir: "{{ playbook_dir }}/scripts"
      environment:
        VKCS_CONFIG_PATH: "{{ playbook_dir }}/secrets/.env"
      register: rot_vk
      delegate_to: localhost
      become: false
      throttle: 1
      changed_when: "'CDN-ресурс создан' in (rot_vk.stderr | default(''))"
      when: not (cdn_dry_run | bool)

    # ГЕЙТ: состояние ресурса в VK, а не живой ответ фронта.
    # Edge после выпуска LE ещё какое-то время флапает (000/200) — это нормально и
    # проходит само. Ждать его здесь бессмысленно: доступность закрывается мониторингом.
    - name: Ожидание готовности CDN-ресурса в VK
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/scripts/setup-cdn.sh"
          - --cdn
          - "{{ cdn_front_domain_new }}"
          - --state
        chdir: "{{ playbook_dir }}/scripts"
      environment:
        VKCS_CONFIG_PATH: "{{ playbook_dir }}/secrets/.env"
      register: rot_state
      delegate_to: localhost
      become: false
      changed_when: false
      until: >-
        (rot_state.stdout | from_json).found | default(false)
        and (rot_state.stdout | from_json).sslEnabled | default(false)
        and (rot_state.stdout | from_json).active | default(false)
      retries: 70
      delay: 30
      when: not (cdn_dry_run | bool)

    - name: 'ПРОВЕРКА: ресурс VK создан и сертификат выпущен'
      ansible.builtin.assert:
        that:
          - (rot_state.stdout | from_json).status == 'active'
          - (rot_state.stdout | from_json).sslEnabled
        fail_msg: "VK не довёл ресурс {{ cdn_front_domain_new }} до active+ssl"
        success_msg: >-
          Ресурс VK {{ (rot_state.stdout | from_json).id }} готов
          (status=active, ssl={{ (rot_state.stdout | from_json).ssl_automated }}) — идём в панель
      when: not (cdn_dry_run | bool)

    - name: Фиксация ресурса VK в состоянии
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: save
      vars:
        cdn_state_patch:
          vk_resource_id: "{{ (rot_state.stdout | from_json).id }}"
      when: not (cdn_dry_run | bool)

    # Необязательная проба: фронт может ещё флапать, это не повод останавливать ротацию.
    - name: Проба фронта (не блокирующая)
      ansible.builtin.uri:
        url: "https://{{ cdn_front_domain_new }}/"
        return_content: false
        status_code: [200]
      register: rot_front
      failed_when: false
      changed_when: false
      delegate_to: localhost
      become: false
      when: not (cdn_dry_run | bool)

    - name: Состояние фронта на момент настройки панели
      ansible.builtin.debug:
        msg: >-
          Фронт {{ cdn_front_domain_new }}: {{ 'отвечает 200' if (rot_front.status | default(0)) == 200
          else 'ещё не отвечает (edge дозревает) — плечо уйдёт в балансер, следим мониторингом' }}
      when: not (cdn_dry_run | bool)

    - name: Создание хоста в панели
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/remnawave/tasks/host_upsert.yml"
      vars:
        cdn_front_domain: "{{ cdn_front_domain_new }}"
        cdn_host_remark: "CDN-POOL {{ inventory_hostname }} {{ cdn_provider | upper }}"
      when: not (cdn_dry_run | bool)

    - name: Включение хоста в балансер
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/remnawave/tasks/balancer_join.yml"
      when: not (cdn_dry_run | bool)

    # Старое плечо гасим только после того, как новое ВСТАЛО в балансер:
    # порядок обратный оставил бы плитку на одном плече в момент правки шаблона.
    - name: Гашение старого плеча
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/remnawave/tasks/host_retire.yml"
      vars:
        remnawave_retire_uuid: "{{ cdn_prev.host_uuid }}"
      when:
        - not (cdn_dry_run | bool)
        - (cdn_prev | default({}, true)).host_uuid | default('') | length > 0
        - cdn_retire_previous | default(false) | bool

    - name: Пометка ротации как завершённой
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: save
      vars:
        cdn_state_patch:
          status: active
          host_uuid: "{{ remnawave_host_uuid }}"
          finished_at: "{{ lookup('pipe', 'date -Iseconds') }}"
      when: not (cdn_dry_run | bool)

    - name: Постановка нового фронта на мониторинг
      ansible.builtin.include_role:
        name: kuma
      vars:
        cdn_front_domain_monitor: "{{ cdn_front_domain_new }}"
      when: not (cdn_dry_run | bool)

    - name: Отчёт в Telegram
      ansible.builtin.include_role:
        name: telegram
      vars:
        telegram_message: |-
          <b>Ротация CDN выполнена</b>
          нода: <code>{{ inventory_hostname }}</code> ({{ cdn_node_ip }})
          origin: <code>{{ cdn_origin_domain_new }}</code>
          фронт: <code>{{ cdn_front_domain_new }}</code>
          инбаунд: <code>{{ cdn_inbound_tag }}</code>  path: <code>{{ cdn_path }}</code>
          ресурс VK: <code>{{ cdn_state.vk_resource_id | default('?') }}</code>
          хост: <code>{{ remnawave_host_uuid }}</code>
          плеч в балансере: {{ (rw_tpl_after.json.response.templateJson.remnawave.injectHosts | first).selector['values'] | default([], true) | length }}
          фронт на момент отчёта: {{ 'отвечает 200' if (rot_front.status | default(0)) == 200 else 'edge ещё дозревает' }}
      when: not (cdn_dry_run | bool)

    - name: Итог ротации
      ansible.builtin.debug:
        msg:
          - "нода:    {{ inventory_hostname }} ({{ ansible_host }})"
          - "origin:  {{ cdn_origin_domain_new }}"
          - "фронт:   {{ cdn_front_domain_new }}"
          - "инбаунд: {{ cdn_inbound_tag }} · path {{ cdn_path }}"
          - "сайт:    {{ cdn_site_variant | default('(dry-run)') }}"
          - "хост:    {{ remnawave_host_uuid | default('(dry-run)') }}"
