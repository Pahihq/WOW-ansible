---
- name: Установить стек мониторинга | cAdvisor, node_exporter, vmagent
  hosts: all
  become: true

  vars:
    vmagent_secrets_file: "{{ playbook_dir }}/secrets/vmagent.yml"

    cadvisor_version: "0.57.0"
    node_exporter_version: "1.9.1"
    vmagent_version: "1.123.0"

    base_dir: /opt/monitoring
    cadvisor_dir: /opt/monitoring/cadvisor
    nodeexporter_dir: /opt/monitoring/nodeexporter
    vmagent_dir: /opt/monitoring/vmagent
    vmagent_conf_dir: /opt/monitoring/vmagent/conf.d
    node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector
    speedtest_metrics_script: /usr/local/bin/speedtest_metrics.sh
    speedtest_metrics_provider: "{{ speedtest_provider | default('ookla') }}"
    node_exporter_install_tmp: /tmp/node_exporter_install
    vmagent_install_tmp: /tmp/vmagent_install

    monitoring_services:
      - cadvisor
      - nodeexporter
      - vmagent
      - speedtest-metrics.timer

    vmagent_scrape_targets:
      - name: cAdvisor
        job_name: integrations/cAdvisor
        target: localhost:9101
        dest: "{{ vmagent_conf_dir }}/cadvisor.yml"
      - name: node_exporter
        job_name: integrations/node_exporter
        target: localhost:9100
        dest: "{{ vmagent_conf_dir }}/nodeexporter.yml"

    monitoring_systemd_units:
      - name: cAdvisor
        src: templates/cadvisor.service.j2
        dest: /etc/systemd/system/cadvisor.service
      - name: node_exporter
        src: templates/nodeexporter.service.j2
        dest: /etc/systemd/system/nodeexporter.service
      - name: vmagent
        src: templates/vmagent.service.j2
        dest: /etc/systemd/system/vmagent.service

    cadvisor_url: "https://github.com/google/cadvisor/releases/download/v{{ cadvisor_version }}/cadvisor-v{{ cadvisor_version }}-linux-amd64"
    node_exporter_url: >-
      {{
        'https://github.com/prometheus/node_exporter/releases/download/v'
        ~ node_exporter_version
        ~ '/node_exporter-'
        ~ node_exporter_version
        ~ '.linux-amd64.tar.gz'
      }}
    vmagent_url: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v{{ vmagent_version }}/vmutils-linux-amd64-v{{ vmagent_version }}.tar.gz"

  pre_tasks:
    - name: Использовать имя хоста inventory как имя экземпляра мониторинга по умолчанию
      ansible.builtin.set_fact:
        monitoring_instance_name: "{{ monitoring_instance_name | default(inventory_hostname, true) }}"

    - name: Проверить файл секретов vmagent на управляющем хосте
      ansible.builtin.stat:
        path: "{{ vmagent_secrets_file }}"
      delegate_to: localhost
      become: false
      register: vmagent_secrets_file_stat

    - name: Прочитать секреты vmagent из файла управляющего хоста
      ansible.builtin.include_vars:
        file: "{{ vmagent_secrets_file }}"
      when: vmagent_secrets_file_stat.stat.exists
      no_log: true

    - name: Проверить секреты vmagent
      ansible.builtin.assert:
        that:
          - vmagent_secrets_file_stat.stat.exists
          - vmagent_remote_write_url is defined
          - vmagent_remote_write_url | length > 0
          - vmagent_remote_write_username is defined
          - vmagent_remote_write_username | length > 0
          - vmagent_remote_write_password is defined
          - vmagent_remote_write_password | length > 0
        fail_msg: "Укажите URL удалённой записи vmagent, имя пользователя и пароль в {{ vmagent_secrets_file }}"

  tasks:
    - name: Определить нормализованное имя хоста
      ansible.builtin.set_fact:
        system_hostname: "{{ monitoring_instance_name | lower | regex_replace('_', '-') }}"

    - name: Установить имя хоста из имени экземпляра мониторинга
      ansible.builtin.hostname:
        name: "{{ system_hostname }}"

    - name: Добавить имя хоста в /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+'
        line: "127.0.1.1 {{ system_hostname }}"
        owner: root
        group: root
        mode: "0644"

    - name: Создать каталоги мониторинга
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ base_dir }}"
        - "{{ cadvisor_dir }}"
        - "{{ nodeexporter_dir }}"
        - "{{ vmagent_dir }}"
        - "{{ vmagent_conf_dir }}"
        - "{{ node_exporter_textfile_dir }}"

    - name: Создать systemd-сервис метрик speedtest
      ansible.builtin.template:
        src: templates/speedtest-metrics.service.j2
        dest: /etc/systemd/system/speedtest-metrics.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Перезагрузить конфигурацию systemd

    - name: Создать systemd-таймер метрик speedtest
      ansible.builtin.copy:
        src: files/speedtest-metrics.timer
        dest: /etc/systemd/system/speedtest-metrics.timer
        owner: root
        group: root
        mode: "0644"
      notify:
        - Перезагрузить конфигурацию systemd

    # =========================
    # speedtest metrics
    # =========================

    - name: Установить скрипт метрик speedtest
      ansible.builtin.copy:
        src: files/speedtest_metrics.sh
        dest: "{{ speedtest_metrics_script }}"
        owner: root
        group: root
        mode: "0755"

    # =========================
    # cAdvisor
    # =========================

    - name: Скачать исполняемый файл cAdvisor
      ansible.builtin.get_url:
        url: "{{ cadvisor_url }}"
        dest: "{{ cadvisor_dir }}/cadvisor"
        owner: root
        group: root
        mode: "0755"
        force: true
      notify:
        - Перезапустить cadvisor

    # =========================
    # node_exporter
    # =========================

    - name: Удалить временный каталог установки node_exporter
      ansible.builtin.file:
        path: "{{ node_exporter_install_tmp }}"
        state: absent

    - name: Создать временный каталог установки node_exporter
      ansible.builtin.file:
        path: "{{ node_exporter_install_tmp }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Скачать и распаковать node_exporter
      ansible.builtin.unarchive:
        src: "{{ node_exporter_url }}"
        dest: "{{ node_exporter_install_tmp }}"
        remote_src: true

    - name: Установить исполняемый файл node_exporter
      ansible.builtin.copy:
        src: "{{ node_exporter_install_tmp }}/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ nodeexporter_dir }}/node_exporter"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify:
        - Перезапустить nodeexporter

    - name: Удалить временные файлы node_exporter
      ansible.builtin.file:
        path: "{{ node_exporter_install_tmp }}"
        state: absent

    # =========================
    # vmagent
    # =========================

    - name: Удалить временный каталог установки vmagent
      ansible.builtin.file:
        path: "{{ vmagent_install_tmp }}"
        state: absent

    - name: Создать временный каталог установки vmagent
      ansible.builtin.file:
        path: "{{ vmagent_install_tmp }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Скачать и распаковать vmutils
      ansible.builtin.unarchive:
        src: "{{ vmagent_url }}"
        dest: "{{ vmagent_install_tmp }}"
        remote_src: true

    - name: Установить исполняемый файл vmagent
      ansible.builtin.copy:
        src: "{{ vmagent_install_tmp }}/vmagent-prod"
        dest: "{{ vmagent_dir }}/vmagent"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify:
        - Перезапустить vmagent

    - name: Удалить временные файлы vmagent
      ansible.builtin.file:
        path: "{{ vmagent_install_tmp }}"
        state: absent

    # =========================
    # vmagent configs
    # =========================

    - name: Создать основной конфигурационный файл сбора метрик vmagent
      ansible.builtin.template:
        src: templates/vmagent-scrape.yml.j2
        dest: "{{ vmagent_dir }}/scrape.yml"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Перезапустить vmagent

    - name: Создать конфигурационные файлы целей vmagent
      ansible.builtin.template:
        src: templates/vmagent-targets.yml.j2
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      vars:
        vmagent_job_name: "{{ item.job_name }}"
        vmagent_target: "{{ item.target }}"
      loop: "{{ vmagent_scrape_targets }}"
      loop_control:
        label: "{{ item.name }}"
      notify:
        - Перезапустить vmagent

    # =========================
    # systemd units
    # =========================

    - name: Создать systemd-юниты мониторинга
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      no_log: true
      loop: "{{ monitoring_systemd_units }}"
      loop_control:
        label: "{{ item.name }}"
      notify:
        - Перезагрузить конфигурацию systemd
        - Перезапустить cadvisor
        - Перезапустить nodeexporter
        - Перезапустить vmagent

    - name: Принудительно перезагрузить конфигурацию systemd перед включением сервисов
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Включить и запустить сервисы мониторинга
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ monitoring_services }}"

  handlers:
    - name: Перезагрузить конфигурацию systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Перезапустить cadvisor
      ansible.builtin.systemd:
        name: cadvisor
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Перезапустить nodeexporter
      ansible.builtin.systemd:
        name: nodeexporter
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Перезапустить vmagent
      ansible.builtin.systemd:
        name: vmagent
        state: restarted
        enabled: true
        daemon_reload: true
