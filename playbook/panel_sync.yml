---
# Приводит панель в соответствие с текущим состоянием CDN-фронтов: создаёт/чинит хост
# и вписывает его в балансер. Идемпотентен.
#
#   ansible-playbook playbook/panel_sync.yml            # по всем нодам пула
#   ansible-playbook playbook/panel_sync.yml --limit node_ch1
#
# Состав пула определяется НЕ инвентарём, а файлами состояния: нода входит в пул,
# если у неё есть завершённая ротация (status: active). Домены берутся оттуда же —
# в инвентаре они протухали после первой же ротации.
- name: Синхронизация CDN-хостов и балансера в Remnawave
  hosts: eu_nodes
  gather_facts: false
  serial: 1
  roles:
    - role: remnawave
  tasks:
    - name: Загрузка состояния ротации
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: load

    - name: Пропуск нод без завершённой ротации
      ansible.builtin.meta: end_host
      when: >-
        (cdn_state | default({}, true)) == {}
        or (cdn_state.status | default('')) != 'active'

    - name: Домены и инбаунд из состояния
      ansible.builtin.set_fact:
        cdn_front_domains_sync: >-
          {{ cdn_state.front_domains
             | default({(cdn_state.cdn_provider | default('vk')): cdn_state.front_domain}) }}
        cdn_inbound_tag: "{{ cdn_state.inbound_tag }}"

    - name: Синхронизация каждого CDN-фронта
      ansible.builtin.include_tasks: tasks/panel_sync_provider.yml
      loop: "{{ cdn_front_domains_sync | dict2items }}"
      loop_control:
        loop_var: cdn_sync_front

    - name: Итог
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: фронты {{ cdn_front_domains_sync }} →
          хосты {{ cdn_sync_host_uuids }} (инбаунд {{ cdn_inbound_tag }}) в балансере
