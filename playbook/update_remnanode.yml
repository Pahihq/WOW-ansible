---
- name: Последовательно обновить Docker Compose RemnaNode
  hosts: docker_nodes
  become: true
  gather_facts: false
  serial: "{{ batch_size | default(3) }}"

  vars:
    remnanode_dir: /opt/remnanode
    compose_pull: true
    compose_remove_orphans: true
    wait_after_update_seconds: 15

  pre_tasks:
    - name: Проверить наличие каталога RemnaNode
      ansible.builtin.stat:
        path: "{{ remnanode_dir }}"
      register: remnanode_path

    - name: Остановить выполнение при отсутствии каталога RemnaNode
      ansible.builtin.fail:
        msg: "Каталог {{ remnanode_dir }} не существует на хосте {{ inventory_hostname }}"
      when: not remnanode_path.stat.isdir | default(false)

    - name: Проверить доступность Docker
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Проверить доступность Docker Compose v2
      ansible.builtin.command: docker compose version
      changed_when: false
      register: docker_compose_v2
      failed_when: false

    - name: Проверить доступность docker-compose v1
      ansible.builtin.command: docker-compose --version
      changed_when: false
      register: docker_compose_v1
      failed_when: false
      when: docker_compose_v2.rc != 0

    - name: Выбрать команду Compose
      ansible.builtin.set_fact:
        compose_cmd: >-
          {{
            'docker compose'
            if docker_compose_v2.rc == 0
            else 'docker-compose'
          }}

    - name: Остановить выполнение при отсутствии Docker Compose
      ansible.builtin.fail:
        msg: "На хосте {{ inventory_hostname }} недоступны ни 'docker compose', ни 'docker-compose'"
      when:
        - docker_compose_v2.rc != 0
        - docker_compose_v1.rc | default(1) != 0

  tasks:
    - name: Показать текущую цель обновления
      ansible.builtin.debug:
        msg: "Обновление {{ inventory_hostname }} в каталоге {{ remnanode_dir }}"

    - name: Скачать последние образы
      ansible.builtin.command: "{{ compose_cmd }} pull"
      args:
        chdir: "{{ remnanode_dir }}"
      changed_when: true
      when: compose_pull | bool

    - name: Пересоздать контейнеры
      ansible.builtin.command: >-
        {{ compose_cmd }} up -d
        {{ '--remove-orphans' if compose_remove_orphans | bool else '' }}
      args:
        chdir: "{{ remnanode_dir }}"
      changed_when: true

    - name: Подождать после обновления
      ansible.builtin.pause:
        seconds: "{{ wait_after_update_seconds }}"

    - name: Получить список запущенных сервисов Compose
      ansible.builtin.command: "{{ compose_cmd }} ps"
      args:
        chdir: "{{ remnanode_dir }}"
      changed_when: false
      register: compose_ps

    - name: Показать состояние Compose
      ansible.builtin.debug:
        var: compose_ps.stdout_lines

    - name: Удалить неиспользуемые образы Docker
      ansible.builtin.command: docker image prune -f
      changed_when: false
      when: prune_images | default(false) | bool
