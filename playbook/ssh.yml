---
- name: Configure WOWVPN neon SSH MOTD and SSH authentication
  hosts: all
  become: true
  gather_facts: true

  vars:
    sshd_config_path: /etc/ssh/sshd_config
    ssh_motd_script: /etc/update-motd.d/99-WOWVPN
    root_authorized_keys_file: "{{ playbook_dir }}/secrets/root_authorized_keys.pub"

  pre_tasks:
    - name: Check root authorized key file on controller
      ansible.builtin.stat:
        path: "{{ root_authorized_keys_file }}"
      delegate_to: localhost
      become: false
      register: root_authorized_keys_file_stat

    - name: Read root authorized key from controller file
      ansible.builtin.set_fact:
        root_authorized_key: "{{ lookup('ansible.builtin.file', root_authorized_keys_file) | trim }}"
      delegate_to: localhost
      become: false
      when: root_authorized_keys_file_stat.stat.exists

    - name: Validate root authorized key
      ansible.builtin.assert:
        that:
          - root_authorized_keys_file_stat.stat.exists
          - root_authorized_key is defined
          - root_authorized_key | length > 0
        fail_msg: "Put root SSH public key into {{ root_authorized_keys_file }}"

  tasks:
    - name: Check update-motd directory
      ansible.builtin.stat:
        path: /etc/update-motd.d
      register: update_motd_dir

    - name: Find executable default Debian MOTD scripts
      ansible.builtin.find:
        paths: /etc/update-motd.d
        file_type: file
        excludes:
          - "{{ ssh_motd_script | basename }}"
      register: default_motd_scripts
      when: update_motd_dir.stat.isdir | default(false)

    - name: Disable executable default Debian MOTD scripts if needed
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "0644"
      loop: "{{ default_motd_scripts.files | default([]) }}"
      when:
        - item.mode is defined
        - (item.mode[-3:] | regex_search('[1357]')) is not none

    - name: Create WOWVPN neon MOTD
      ansible.builtin.copy:
        dest: "{{ ssh_motd_script }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash

          C="\e[38;2;42;231;246m"
          R="\e[0m"
          W="\e[38;2;255;255;255m"
          G="\e[38;2;120;120;120m"
          RED="\e[38;2;255;80;80m"

          HOST=$(hostname)
          IP=$(hostname -I | awk '{print $1}')
          UPTIME=$(uptime -p | sed 's/up //')
          RAM=$(free -h | awk '/Mem:/ {print $3 " / " $2}')
          LOAD=$(uptime | awk -F'load average:' '{ print $2 }')

          echo ""
          echo -e "${C}"
          echo "██╗    ██╗ ██████╗ ██╗    ██╗██╗   ██╗██████╗ ███╗   ██╗"
          echo "██║    ██║██╔═══██╗██║    ██║██║   ██║██╔══██╗████╗  ██║"
          echo "██║ █╗ ██║██║   ██║██║ █╗ ██║██║   ██║██████╔╝██╔██╗ ██║"
          echo "██║███╗██║██║   ██║██║███╗██║╚██╗ ██╔╝██╔═══╝ ██║╚██╗██║"
          echo "╚███╔███╔╝╚██████╔╝╚███╔███╔╝ ╚████╔╝ ██║     ██║ ╚████║"
          echo " ╚══╝╚══╝  ╚═════╝  ╚══╝╚══╝   ╚═══╝  ╚═╝     ╚═╝  ╚═══╝"
          echo -e "${R}"

          echo -e "${G}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${R}"

          echo -e "${C}󰒋 HOST${R}      ${W}$HOST${R}"
          echo -e "${C}󰩟 IP${R}        ${W}$IP${R}"
          echo -e "${C}󰅐 UPTIME${R}    ${W}$UPTIME${R}"
          echo -e "${C}󰍛 RAM${R}       ${W}$RAM${R}"
          echo -e "${C}󰓅 LOAD${R}      ${W}$LOAD${R}"

          echo ""

          echo -e "${RED}⚠ WARNING${R}  Unauthorized access prohibited"
          echo -e "${C}⚡ All connections are monitored and logged${R}"

          echo -e "${G}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${R}"

          echo ""

    - name: Find extra sshd config files
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        patterns: "*.conf"
        file_type: file
      register: sshd_extra_configs
      failed_when: false

    - name: Read extra sshd config files
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ sshd_extra_configs.files | default([]) }}"
      register: sshd_extra_config_contents
      when: sshd_extra_configs.matched | default(0) | int > 0

    - name: Remove only truly conflicting sshd config snippets
      ansible.builtin.file:
        path: "{{ item.source }}"
        state: absent
      loop: "{{ sshd_extra_config_contents.results | default([]) }}"
      when: >
        item.content is defined and
        (
          (item.content | b64decode) is search('(?im)^\\s*PasswordAuthentication\\s+no\\s*$')
          or (item.content | b64decode) is search('(?im)^\\s*PubkeyAuthentication\\s+no\\s*$')
          or (item.content | b64decode) is search('(?im)^\\s*PermitRootLogin\\s+(no|prohibit-password|without-password)\\s*$')
          or (item.content | b64decode) is search('(?im)^\\s*AuthenticationMethods\\s+.*$')
        )
      notify: Restart ssh service

    - name: Remove old SSH authentication directives from main config
      ansible.builtin.lineinfile:
        path: "{{ sshd_config_path }}"
        regexp: "{{ item }}"
        state: absent
        backup: true
      loop:
        - '^\s*PermitRootLogin\s+.*$'
        - '^\s*PasswordAuthentication\s+.*$'
        - '^\s*PubkeyAuthentication\s+.*$'
        - '^\s*KbdInteractiveAuthentication\s+.*$'
        - '^\s*ChallengeResponseAuthentication\s+.*$'
        - '^\s*AuthenticationMethods\s+.*$'
        - '^\s*PermitEmptyPasswords\s+.*$'
        - '^\s*X11Forwarding\s+.*$'
        - '^\s*MaxAuthTries\s+.*$'
        - '^\s*ClientAliveInterval\s+.*$'
        - '^\s*ClientAliveCountMax\s+.*$'
        - '^\s*LoginGraceTime\s+.*$'
        - '^\s*DebianBanner\s+.*$'
        - '^\s*PrintMotd\s+.*$'
        - '^\s*PrintLastLog\s+.*$'
      notify: Restart ssh service

    - name: Configure SSH authentication policy
      ansible.builtin.blockinfile:
        path: "{{ sshd_config_path }}"
        marker: "# {mark} ANSIBLE MANAGED SSH AUTH POLICY"
        backup: true
        block: |
          # Disable default Debian SSH banner
          DebianBanner no

          # Enable dynamic MOTD
          PrintMotd yes

          # Enable last login message
          PrintLastLog yes

          # Allow root login by password and SSH key
          PermitRootLogin yes

          # Allow password authentication for all users
          PasswordAuthentication yes

          # Enable SSH public key authentication
          PubkeyAuthentication yes

          # Disable keyboard-interactive authentication
          KbdInteractiveAuthentication no

          # Disable challenge-response authentication
          ChallengeResponseAuthentication no

          # Disallow empty passwords
          PermitEmptyPasswords no

          # Disable X11 forwarding
          X11Forwarding no

          # Limit failed authentication attempts
          MaxAuthTries 3

          # Send keepalive every 15 minutes
          ClientAliveInterval 900

          # Disconnect after 2 missed keepalives
          ClientAliveCountMax 2

          # Time allowed for login
          LoginGraceTime 30
      notify: Restart ssh service

    - name: Validate sshd config
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Disable default pam_motd output
      ansible.builtin.replace:
        path: /etc/pam.d/sshd
        regexp: '^(session\s+optional\s+pam_motd\.so.*)$'
        replace: '# \1'
        backup: true
      notify: Restart ssh service

    - name: Show WOWVPN MOTD directly on SSH login
      ansible.builtin.lineinfile:
        path: /etc/pam.d/sshd
        regexp: '^session\s+optional\s+pam_exec\.so\s+stdout\s+/usr/bin/run-parts\s+/etc/update-motd\.d$'
        line: 'session    optional     pam_exec.so stdout /usr/bin/run-parts /etc/update-motd.d'
        insertbefore: '^#?\s*session\s+optional\s+pam_motd\.so'
        state: present
        backup: true
      notify: Restart ssh service

    - name: Ensure root .ssh directory exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Add SSH public key to root authorized_keys
      ansible.builtin.authorized_key:
        user: root
        state: present
        key: "{{ root_authorized_key }}"

  handlers:
    - name: Restart ssh service
      ansible.builtin.service:
        name: "{{ 'sshd' if ansible_facts.os_family in ['RedHat', 'Rocky', 'AlmaLinux', 'Suse'] else 'ssh' }}"
        state: restarted
