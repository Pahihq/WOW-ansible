---
- name: Install speedtest metrics files and update node_exporter systemd unit
  hosts: all
  become: true

  vars:
    nodeexporter_dir: /opt/monitoring/nodeexporter
    node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector
    speedtest_metrics_script: /usr/local/bin/speedtest_metrics.sh

  tasks:
    - name: Create node_exporter textfile collector directory
      ansible.builtin.file:
        path: "{{ node_exporter_textfile_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install speedtest metrics script
      ansible.builtin.copy:
        src: files/speedtest_metrics.sh
        dest: "{{ speedtest_metrics_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install speedtest metrics systemd service
      ansible.builtin.copy:
        src: files/speedtest-metrics.service
        dest: /etc/systemd/system/speedtest-metrics.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd

    - name: Install speedtest metrics systemd timer
      ansible.builtin.copy:
        src: files/speedtest-metrics.timer
        dest: /etc/systemd/system/speedtest-metrics.timer
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd

    - name: Rewrite node_exporter systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/nodeexporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=root
          Group=root
          Type=simple
          ExecStart={{ nodeexporter_dir }}/node_exporter --web.listen-address=127.0.0.1:9100 --collector.textfile.directory={{ node_exporter_textfile_dir }}
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart nodeexporter

    - name: Force systemd reload before enabling units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start node_exporter and speedtest timer
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - nodeexporter
        - speedtest-metrics.timer

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart nodeexporter
      ansible.builtin.systemd:
        name: nodeexporter
        state: restarted
        enabled: true
        daemon_reload: true
