---
- name: Install and configure RemnaNode server on Debian/Ubuntu
  hosts: docker_nodes
  become: true
  gather_facts: true

  vars:
    sysctl_conf_path: /etc/sysctl.d/99-vps-setup.conf

    remnanode_dir: /opt/remnanode

    swap_file_path: /swapfile
    swap_percent_of_root_fs: 10
    swap_min_size_mb: 512

    docker_keyring_path: /etc/apt/keyrings/docker.asc
    docker_sources_path: /etc/apt/sources.list.d/docker.sources

    ookla_armored_key_path: /tmp/ookla_speedtest-cli.gpgkey
    ookla_keyring_path: /etc/apt/keyrings/ookla_speedtest-cli-archive-keyring.gpg
    ookla_sources_path: /etc/apt/sources.list.d/ookla_speedtest-cli.sources

    supported_distributions:
      - Debian
      - Ubuntu

    docker_repo_os_map:
      Debian: debian
      Ubuntu: ubuntu

    ookla_repo_os_map:
      Debian: debian
      Ubuntu: ubuntu

    repo_codename_fallbacks:
      Debian:
        - trixie
        - bookworm
        - bullseye
      Ubuntu:
        - noble
        - jammy
        - focal
        - bionic

    sysctl_params:
      net.core.default_qdisc: fq
      net.ipv4.tcp_congestion_control: bbr
      net.core.somaxconn: "65535"
      net.ipv4.tcp_max_syn_backlog: "8192"
      net.ipv4.tcp_tw_reuse: "1"
      net.ipv4.tcp_fin_timeout: "15"
      vm.swappiness: "40"
      fs.file-max: "1000000"

  tasks:
    # -------------------------
    # Validate OS / variables
    # -------------------------

    - name: Validate supported distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution in supported_distributions
          - ansible_distribution_release is defined
          - ansible_distribution_release | length > 0
        fail_msg: >-
          This playbook supports only Debian and Ubuntu.
          Current system: {{ ansible_distribution }}
          {{ ansible_distribution_version }}
          {{ ansible_distribution_release | default('unknown') }}

    - name: Define OS-specific repository variables
      ansible.builtin.set_fact:
        docker_repo_os: "{{ docker_repo_os_map[ansible_distribution] }}"
        ookla_repo_os: "{{ ookla_repo_os_map[ansible_distribution] }}"
        distro_codename: "{{ ansible_distribution_release }}"
        repo_codename_candidates: "{{ ([ansible_distribution_release] + repo_codename_fallbacks[ansible_distribution]) | unique | list }}"

    # -------------------------
    # Base packages
    # -------------------------

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - nftables
          - apt-transport-https
          - python3-apt
          - lsb-release
        state: present
        update_cache: true

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Enable and start nftables
      ansible.builtin.systemd:
        name: nftables
        enabled: true
        state: started

    # -------------------------
    # Swap
    # -------------------------

    - name: Check current active swap
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: active_swaps
      changed_when: false
      failed_when: false

    - name: Check if swap file already exists
      ansible.builtin.stat:
        path: "{{ swap_file_path }}"
      register: swap_file_stat

    - name: Get root filesystem size in MB
      ansible.builtin.command: df -m --output=size /
      register: root_fs_size_mb_raw
      changed_when: false
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists

    - name: Calculate swap size
      ansible.builtin.set_fact:
        swap_size_mb: >-
          {{
            [
              (((root_fs_size_mb_raw.stdout_lines[1] | int) * swap_percent_of_root_fs / 100) | round(0, 'floor') | int),
              swap_min_size_mb
            ] | max
          }}
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists

    - name: Show calculated swap size
      ansible.builtin.debug:
        msg: "Swap не найден. Будет создан {{ swap_file_path }} размером {{ swap_size_mb }} MB"
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists

    - name: Create swap file with fallocate
      ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M {{ swap_file_path }}"
      register: swap_fallocate_result
      changed_when: swap_fallocate_result.rc == 0
      failed_when: false
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists

    - name: Create swap file with dd if fallocate failed
      ansible.builtin.command: "dd if=/dev/zero of={{ swap_file_path }} bs=1M count={{ swap_size_mb }} status=none"
      changed_when: true
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists
        - swap_fallocate_result.rc is defined
        - swap_fallocate_result.rc != 0

    - name: Set swap file permissions
      ansible.builtin.file:
        path: "{{ swap_file_path }}"
        owner: root
        group: root
        mode: "0600"
      when: active_swaps.stdout | trim == ""

    - name: Format swap file
      ansible.builtin.command: "mkswap {{ swap_file_path }}"
      changed_when: true
      when:
        - active_swaps.stdout | trim == ""
        - not swap_file_stat.stat.exists

    - name: Enable swap file
      ansible.builtin.command: "swapon {{ swap_file_path }}"
      changed_when: true
      failed_when: false
      when: active_swaps.stdout | trim == ""

    - name: Ensure swap file is present in fstab
      ansible.builtin.mount:
        name: none
        src: "{{ swap_file_path }}"
        fstype: swap
        opts: sw
        dump: "0"
        passno: "0"
        state: present

    - name: Show existing swap status
      ansible.builtin.debug:
        msg: "Swap уже есть, ничего не делаю: {{ active_swaps.stdout_lines }}"
      when: active_swaps.stdout | trim != ""

    - name: Show final swap status
      ansible.builtin.command: swapon --show
      register: swap_status
      changed_when: false
      failed_when: false

    - name: Print final swap status
      ansible.builtin.debug:
        var: swap_status.stdout_lines

    # -------------------------
    # Sysctl / BBR
    # -------------------------

    - name: Write sysctl optimization config
      ansible.builtin.copy:
        dest: "{{ sysctl_conf_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible
          # VPS network optimization: BBR + TCP/sysctl tuning

          {% for key, value in sysctl_params.items() %}
          {{ key }} = {{ value }}
          {% endfor %}

    - name: Apply sysctl params immediately
      ansible.builtin.command: "sysctl -w {{ item.key }}={{ item.value }}"
      loop: "{{ sysctl_params | dict2items }}"
      changed_when: false
      failed_when: false

    - name: Apply sysctl system config
      ansible.builtin.command: sysctl --system
      changed_when: false
      failed_when: false

    - name: Check current TCP congestion control
      ansible.builtin.command: sysctl net.ipv4.tcp_congestion_control
      register: bbr_check
      changed_when: false
      failed_when: false

    - name: Show BBR status
      ansible.builtin.debug:
        msg: >-
          {% if 'bbr' in bbr_check.stdout %}
          BBR активен + sysctl оптимизирован
          {% else %}
          BBR НЕ активен. Текущее значение: {{ bbr_check.stdout | default('unknown') }}
          {% endif %}

    # -------------------------
    # Ookla Speedtest
    # -------------------------

    - name: Check installed package for /usr/bin/speedtest
      ansible.builtin.command: dpkg-query -S /usr/bin/speedtest
      register: speedtest_owner_check
      changed_when: false
      failed_when: false

    - name: Remove conflicting distro speedtest-cli package
      ansible.builtin.apt:
        name: speedtest-cli
        state: absent
        purge: true
      when: >
        speedtest_owner_check.rc == 0 and
        'speedtest-cli' in speedtest_owner_check.stdout

    - name: Fix interrupted dpkg state
      ansible.builtin.command: dpkg --configure -a
      changed_when: false
      failed_when: false

    - name: Fix broken apt dependencies
      ansible.builtin.apt:
        state: fixed
      failed_when: false

    - name: Check if official Ookla Speedtest package is installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' speedtest
      register: official_speedtest_package_check
      changed_when: false
      failed_when: false

    - name: Find old/conflicting Ookla repository files
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns:
          - "ookla_speedtest-cli*.list"
          - "ookla_speedtest-cli*.sources"
        file_type: file
      register: old_ookla_repo_files
      when: official_speedtest_package_check.rc != 0

    - name: Remove old/conflicting Ookla repository files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_ookla_repo_files.files | default([]) }}"
      when: official_speedtest_package_check.rc != 0

    - name: Remove old/conflicting Ookla keyrings
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/keyrings/ookla_speedtest-cli.asc
        - /etc/apt/keyrings/ookla_speedtest-cli-archive-keyring.gpg
        - /usr/share/keyrings/ookla_speedtest-cli-archive-keyring.gpg
      when: official_speedtest_package_check.rc != 0

    - name: Clean apt cache after removing conflicting Ookla repo
      ansible.builtin.command: apt-get clean
      register: apt_clean_result
      retries: 20
      delay: 15
      until: apt_clean_result.rc == 0
      changed_when: false

    - name: Check available Ookla repositories
      ansible.builtin.uri:
        url: "https://packagecloud.io/ookla/speedtest-cli/{{ ookla_repo_os }}/dists/{{ item }}/Release"
        method: GET
        status_code:
          - 200
          - 404
        return_content: false
        timeout: 15
      loop: "{{ repo_codename_candidates }}"
      register: ookla_repo_checks
      changed_when: false
      failed_when: false
      when: official_speedtest_package_check.rc != 0

    - name: Select first available Ookla repository codename
      ansible.builtin.set_fact:
        ookla_supported_codename: >-
          {{
            (
              ookla_repo_checks.results
              | selectattr('status', 'equalto', 200)
              | map(attribute='item')
              | list
              | first
            )
            | default('', true)
          }}
      when: official_speedtest_package_check.rc != 0

    - name: Fail if no supported Ookla repository codename was found
      ansible.builtin.fail:
        msg: >-
          No supported Ookla Speedtest repository was found.
          OS: {{ ansible_distribution }}
          Repo OS: {{ ookla_repo_os }}
          Tried codenames: {{ repo_codename_candidates | join(', ') }}.
      when:
        - official_speedtest_package_check.rc != 0
        - ookla_supported_codename | length == 0

    - name: Download Ookla packagecloud GPG key as armored file
      ansible.builtin.get_url:
        url: https://packagecloud.io/ookla/speedtest-cli/gpgkey
        dest: "{{ ookla_armored_key_path }}"
        owner: root
        group: root
        mode: "0644"
        force: true
      when: official_speedtest_package_check.rc != 0

    - name: Convert Ookla GPG key to binary keyring
      ansible.builtin.command:
        cmd: "gpg --dearmor -o {{ ookla_keyring_path }} {{ ookla_armored_key_path }}"
      changed_when: true
      when: official_speedtest_package_check.rc != 0

    - name: Set Ookla keyring permissions
      ansible.builtin.file:
        path: "{{ ookla_keyring_path }}"
        owner: root
        group: root
        mode: "0644"
      when: official_speedtest_package_check.rc != 0

    - name: Add Ookla Speedtest repository
      ansible.builtin.copy:
        dest: "{{ ookla_sources_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://packagecloud.io/ookla/speedtest-cli/{{ ookla_repo_os }}
          Suites: {{ ookla_supported_codename }}
          Components: main
          Signed-By: {{ ookla_keyring_path }}
      when: official_speedtest_package_check.rc != 0

    - name: Update apt cache after adding Ookla repo
      ansible.builtin.apt:
        update_cache: true
      when: official_speedtest_package_check.rc != 0

    - name: Install official Ookla Speedtest
      ansible.builtin.apt:
        name: speedtest
        state: present
      when: official_speedtest_package_check.rc != 0

    - name: Accept Ookla license and GDPR
      ansible.builtin.command: speedtest --accept-license --accept-gdpr
      changed_when: false
      failed_when: false

    - name: Run Speedtest
      ansible.builtin.command: speedtest
      register: speedtest_result
      changed_when: false
      failed_when: false

    - name: Show Speedtest result
      ansible.builtin.debug:
        var: speedtest_result.stdout_lines

    # -------------------------
    # Docker
    # -------------------------

    - name: Check if official Docker package is installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' docker-ce
      register: docker_ce_package_check
      changed_when: false
      failed_when: false

    - name: Remove conflicting Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent
      when: docker_ce_package_check.rc != 0

    - name: Get dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false
      when: docker_ce_package_check.rc != 0

    - name: Check available Docker repositories
      ansible.builtin.uri:
        url: "https://download.docker.com/linux/{{ docker_repo_os }}/dists/{{ item }}/Release"
        method: GET
        status_code:
          - 200
          - 404
        return_content: false
        timeout: 15
      loop: "{{ repo_codename_candidates }}"
      register: docker_repo_checks
      changed_when: false
      failed_when: false
      when: docker_ce_package_check.rc != 0

    - name: Select first available Docker repository codename
      ansible.builtin.set_fact:
        docker_supported_codename: >-
          {{
            (
              docker_repo_checks.results
              | selectattr('status', 'equalto', 200)
              | map(attribute='item')
              | list
              | first
            )
            | default('', true)
          }}
      when: docker_ce_package_check.rc != 0

    - name: Fail if no supported Docker repository codename was found
      ansible.builtin.fail:
        msg: >-
          No supported Docker repository was found.
          OS: {{ ansible_distribution }}
          Repo OS: {{ docker_repo_os }}
          Tried codenames: {{ repo_codename_candidates | join(', ') }}.
      when:
        - docker_ce_package_check.rc != 0
        - docker_supported_codename | length == 0

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_repo_os }}/gpg"
        dest: "{{ docker_keyring_path }}"
        owner: root
        group: root
        mode: "0644"
        force: true
      when: docker_ce_package_check.rc != 0

    - name: Add Docker official repository
      ansible.builtin.copy:
        dest: "{{ docker_sources_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/{{ docker_repo_os }}
          Suites: {{ docker_supported_codename }}
          Components: stable
          Architectures: {{ dpkg_arch.stdout }}
          Signed-By: {{ docker_keyring_path }}
      when: docker_ce_package_check.rc != 0

    - name: Update apt cache after adding Docker repo
      ansible.builtin.apt:
        update_cache: true
      when: docker_ce_package_check.rc != 0

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: docker_ce_package_check.rc != 0

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create RemnaNode directory
      ansible.builtin.file:
        path: "{{ remnanode_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

- name: Configure Remnawave Node behind nginx with Trojan gRPC TLS
  hosts: docker_nodes
  become: true
  gather_facts: true

  vars:
    remnanode_domain: "{{ domain | default(node_domain | default(inventory_hostname)) }}"
    remnanode_email: admin@wowsecure.ru
    remnanode_secret_key_file: "{{ playbook_dir }}/secrets/remnanode_secret_key"

    remnanode_dir: /opt/remnanode
    certbot_dir: /opt/certbot
    web_root: /var/www/html
    site_host_dir: "{{ remnanode_dir }}/site"
    site_archive_local: "{{ playbook_dir }}/files/site.zip"
    site_archive_remote: "{{ remnanode_dir }}/site.zip"

    grpc_service_name: trgrpc
    xray_grpc_listen: 127.0.0.1
    xray_grpc_port: 8443
    remnanode_api_port: 21412

  pre_tasks:
    - name: Check required inventory variables
      ansible.builtin.assert:
        that:
          - remnanode_domain is defined
          - remnanode_domain | length > 3
          - remnanode_email is defined
          - remnanode_email | length > 3
        fail_msg: "Set domain in inventory for this host."

    - name: Check local Remnawave secret key file
      ansible.builtin.stat:
        path: "{{ remnanode_secret_key_file }}"
      delegate_to: localhost
      become: false
      register: remnanode_secret_key_file_stat

    - name: Fail if local secret key file is missing
      ansible.builtin.assert:
        that:
          - remnanode_secret_key_file_stat.stat.exists
        fail_msg: "Secret key file is missing: {{ remnanode_secret_key_file }}"

    - name: Check local site archive
      ansible.builtin.stat:
        path: "{{ site_archive_local }}"
      delegate_to: localhost
      become: false
      register: site_archive_local_stat

    - name: Fail if local site archive is missing
      ansible.builtin.assert:
        that:
          - site_archive_local_stat.stat.exists
        fail_msg: "Site archive is missing: {{ site_archive_local }}"

    - name: Read local Remnawave secret key
      ansible.builtin.set_fact:
        remnanode_secret_key: "{{ lookup('ansible.builtin.file', remnanode_secret_key_file) | trim }}"
      no_log: true

    - name: Check Docker CLI
      ansible.builtin.command: docker --version
      register: docker_cli_check
      changed_when: false

    - name: Check Docker Compose plugin
      ansible.builtin.command: docker compose version
      register: docker_compose_check
      changed_when: false

  tasks:
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ remnanode_dir }}"
        - "{{ site_host_dir }}"
        - /var/www
        - "{{ certbot_dir }}"
        - "{{ certbot_dir }}/certs"
        - "{{ certbot_dir }}/var-lib-letsencrypt"

    - name: Link nginx web root to site next to Remnawave compose file
      ansible.builtin.file:
        src: "{{ site_host_dir }}"
        dest: "{{ web_root }}"
        state: link
        force: true
        owner: root
        group: root

    - name: Create fallback web page
      ansible.builtin.template:
        src: templates/remnanode-index.html.j2
        dest: "{{ site_host_dir }}/index.html"
        owner: root
        group: root
        mode: "0644"

    - name: Copy site archive next to Remnawave compose file
      ansible.builtin.copy:
        src: "{{ site_archive_local }}"
        dest: "{{ site_archive_remote }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install site archive extractor
      ansible.builtin.package:
        name: unzip
        state: present

    - name: Unpack site archive next to Remnawave compose file
      ansible.builtin.shell: |
        set -euo pipefail

        rm -rf {{ site_host_dir | quote }}/*
        unzip -oq {{ site_archive_remote | quote }} -d {{ site_host_dir | quote }}

        chown -R root:root {{ site_host_dir | quote }}
        find {{ site_host_dir | quote }} -type d -exec chmod 0755 {} \;
        find {{ site_host_dir | quote }} -type f -exec chmod 0644 {} \;
      args:
        executable: /bin/bash

    - name: Check existing Let's Encrypt certificate
      ansible.builtin.stat:
        path: "{{ certbot_dir }}/certs/live/{{ remnanode_domain }}/fullchain.pem"
      register: letsencrypt_fullchain

    - name: Issue Let's Encrypt certificate
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - "{{ certbot_dir }}/certs:/etc/letsencrypt"
          - -v
          - "{{ certbot_dir }}/var-lib-letsencrypt:/var/lib/letsencrypt"
          - --network
          - host
          - certbot/certbot
          - certonly
          - --standalone
          - --non-interactive
          - --agree-tos
          - --email
          - "{{ remnanode_email }}"
          - -d
          - "{{ remnanode_domain }}"
      when: not letsencrypt_fullchain.stat.exists
      notify: Start Remnawave stack

    - name: Write nginx configuration
      ansible.builtin.template:
        src: templates/remnanode-nginx.conf.j2
        dest: "{{ remnanode_dir }}/nginx.conf"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Start Remnawave stack
        - Test nginx configuration
        - Reload nginx

    - name: Write Remnawave Node compose file
      ansible.builtin.template:
        src: templates/remnanode-docker-compose.yml.j2
        dest: "{{ remnanode_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify:
        - Start Remnawave stack
        - Test nginx configuration
        - Reload nginx

    - name: Check HTTPS health endpoint
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - --max-time
          - "10"
          - "https://{{ remnanode_domain }}/healthz"
      register: healthz_check
      changed_when: false

    - name: Show connection settings
      ansible.builtin.debug:
        msg:
          - "Address/SNI/Host: {{ remnanode_domain }}"
          - "Port: 443"
          - "Protocol: Trojan"
          - "Network: gRPC"
          - "Security: TLS"
          - "gRPC serviceName: {{ grpc_service_name }}"
          - "Internal Xray gRPC: {{ xray_grpc_listen }}:{{ xray_grpc_port }}"

  handlers:
    - name: Start Remnawave stack
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ remnanode_dir }}"

    - name: Test nginx configuration
      ansible.builtin.command: docker exec remnawave-nginx nginx -t

    - name: Reload nginx
      ansible.builtin.shell: docker exec remnawave-nginx nginx -s reload || docker restart remnawave-nginx
