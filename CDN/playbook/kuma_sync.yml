---
# Ставит текущие CDN-фронты пула на мониторинг. Идемпотентен.
# Пул и домены — из файлов состояния, не из инвентаря.
#   ansible-playbook playbook/kuma_sync.yml
- name: Синхронизация мониторов CDN-фронтов
  hosts: eu_nodes
  gather_facts: false
  serial: 1
  tasks:
    - name: Загрузка состояния ротации
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: load

    - name: Пропуск нод без завершённой ротации
      ansible.builtin.meta: end_host
      when: >-
        (cdn_state | default({}, true)) == {}
        or (cdn_state.status | default('')) != 'active'

    - name: Домены фронтов из состояния
      ansible.builtin.set_fact:
        cdn_front_domains_sync: >-
          {{ cdn_state.front_domains
             | default({(cdn_state.cdn_provider | default('vk')): cdn_state.front_domain}) }}

    - name: Постановка фронтов на мониторинг
      ansible.builtin.include_role:
        name: kuma
      vars:
        cdn_front_domain_monitor: "{{ item.value }}"
        kuma_monitor_name: "CDN_{{ inventory_hostname }}_{{ item.key | upper }}"
        kuma_monitor_rename_from: >-
          {{ 'CDN ' ~ inventory_hostname
             if cdn_state.front_domains is not defined and item.key == 'vk' else '' }}
      loop: "{{ cdn_front_domains_sync | dict2items }}"
      loop_control:
        label: "{{ item.key }}: {{ item.value }}"
