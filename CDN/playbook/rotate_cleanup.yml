---
# Вычищает мусор незавершённых ротаций по файлам состояния:
# A-запись origin, CNAME всех фронтов, CDN-ресурсы и каталог сайта.
#
#   предпросмотр: ansible-playbook playbook/rotate_cleanup.yml --limit node_ch1
#   применение:   ansible-playbook playbook/rotate_cleanup.yml --limit node_ch1 -e apply=true
#
# Ротации со статусом active не трогаются никогда — только in_progress/failed.
- name: Чистка брошенных ротаций
  hosts: eu_nodes
  gather_facts: false
  serial: 1
  vars:
    apply: false
  tasks:
    - name: Загрузка состояния
      ansible.builtin.include_role:
        name: cdn_state
        tasks_from: load
        public: true

    - name: Пропуск нод без мусора
      ansible.builtin.meta: end_host
      when: (cdn_state | default({}, true)) == {} or (cdn_state.status | default('')) == 'active'

    - name: Нормализация фронтов и ресурсов state
      ansible.builtin.set_fact:
        cdn_cleanup_front_domains: >-
          {{ cdn_state.front_domains
             | default({(cdn_state.cdn_provider | default('vk')): cdn_state.front_domain}) }}
        cdn_cleanup_resource_ids: >-
          {{ cdn_state.cdn_resource_ids
             | default({(cdn_state.cdn_provider | default('vk')):
                        cdn_state.cdn_resource_id | default(cdn_state.vk_resource_id | default(''))}) }}

    - name: Проверка фронтов state
      ansible.builtin.assert:
        that:
          - cdn_cleanup_front_domains | length > 0
          - cdn_cleanup_front_domains.keys() | difference(['vk', 'yandex']) | length == 0
          - cdn_cleanup_front_domains.values() | select('string') | reject('equalto', '') | list | length == cdn_cleanup_front_domains | length
        fail_msg: "State содержит пустой фронт или неподдерживаемого CDN-провайдера; очистка остановлена"

    - name: Что будет вычищено
      ansible.builtin.debug:
        msg:
          - "нода:    {{ inventory_hostname }} (статус {{ cdn_state.status | default('?') }})"
          - "origin:  {{ cdn_state.origin_domain | default('-') }} (A-запись + каталог сайта)"
          - "фронты:  {{ cdn_cleanup_front_domains }} (CNAME)"
          - "CDN:     {{ cdn_cleanup_resource_ids }}"
          - "режим:   {{ 'УДАЛЕНИЕ' if apply | bool else 'предпросмотр, добавь -e apply=true' }}"

    - name: Чтение credentials Cloudflare
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/secrets/.env"
      register: cl_env
      delegate_to: localhost
      become: false
      no_log: true

    - name: Разбор credentials
      ansible.builtin.set_fact:
        cl_token: "{{ (cl_env.content | b64decode | regex_search('CLOUDFLARE_API_TOKEN=\"?([^\"\\n]+)', '\\1') | first) }}"
        cl_account: "{{ (cl_env.content | b64decode | regex_search('CLOUDFLARE_ACCOUNT_ID=\"?([^\"\\n]+)', '\\1') | first) }}"
      no_log: true

    - name: Получение зон
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones?account.id={{ cl_account }}&per_page=50"
        headers: { Authorization: "Bearer {{ cl_token }}" }
        return_content: true
      register: cl_zones
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true

    - name: Поиск DNS-записей мусорных доменов
      ansible.builtin.uri:
        url: >-
          https://api.cloudflare.com/client/v4/zones/{{ (cl_zones.json.result
          | selectattr('name', 'equalto', item.split('.')[-2:] | join('.')) | list | first).id
          }}/dns_records?name={{ item }}
        headers: { Authorization: "Bearer {{ cl_token }}" }
        return_content: true
      register: cl_recs
      loop: >-
        {{ ([cdn_state.origin_domain | default('')]
            + (cdn_cleanup_front_domains.values() | list))
           | reject('equalto', '') | unique | list }}
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true

    - name: Удаление DNS-записей
      ansible.builtin.uri:
        # id зоны — из списка зон: Cloudflare больше не отдаёт zone_id в объекте
        # записи (проверено 2026-08-10), обращение к нему роняет задачу.
        url: >-
          https://api.cloudflare.com/client/v4/zones/{{ (cl_zones.json.result
          | selectattr('name', 'equalto', item.0.item.split('.')[-2:] | join('.'))
          | list | first).id }}/dns_records/{{ item.0.json.result[0].id }}
        method: DELETE
        headers: { Authorization: "Bearer {{ cl_token }}" }
        status_code: [200]
      loop: "{{ cl_recs.results | zip(cl_recs.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
      when:
        - apply | bool
        - item.0.json.result | length > 0
      delegate_to: localhost
      become: false
      changed_when: true
      no_log: true

    - name: Удаление CDN-ресурсов брошенной ротации
      ansible.builtin.include_tasks: tasks/cdn_delete_provider.yml
      vars:
        cdn_delete_provider: "{{ item.key }}"
        cdn_delete_domain: "{{ item.value }}"
      loop: "{{ cdn_cleanup_front_domains | dict2items }}"
      loop_control:
        label: "{{ item.key }}: {{ item.value }}"
      when:
        - apply | bool

    - name: Удаление каталога сайта на ноде
      ansible.builtin.file:
        path: "/opt/remnanode/nginx/site/{{ cdn_state.origin_domain }}"
        state: absent
      when:
        - apply | bool
        - cdn_state.origin_domain is defined
      become: true

    - name: Сброс состояния
      ansible.builtin.file:
        path: "{{ cdn_state_file }}"
        state: absent
      delegate_to: localhost
      become: false
      when: apply | bool

    - name: Итог
      ansible.builtin.debug:
        msg: >-
          {{ 'Вычищены DNS и сайт: ' ~ (cdn_state.origin_domain | default('-'))
             ~ '. CDN-ресурсы удалены для фронтов ' ~ (cdn_cleanup_front_domains | to_json) ~ '.'
             if apply | bool else 'Это был предпросмотр — ничего не удалено.' }}
